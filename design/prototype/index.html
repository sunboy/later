.letter { margin: var(--sp-3) var(--sp-4) var(--sp-4); border: 1px solid var(--c-line-strong); border-radius: var(--r-md); background: var(--c-bg); }
.letter-h { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px var(--sp-3); margin: 0; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-line); font-size: var(--fs-sm); }
.letter-h dt { color: var(--c-text-3); }
.letter-h dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.letter-h .mono { font-size: 12px; color: var(--c-text-2); }
.letter-b { padding: var(--sp-4); white-space: pre-wrap; line-height: 1.6; font-size: var(--fs-base); overflow-wrap: anywhere; }
.letter-edit { border: 0; border-radius: 0 0 var(--r-md) var(--r-md); min-height: 160px; padding: var(--sp-4); font-size: var(--fs-base); background: var(--c-surface); }
.draft-f { display: flex; gap: var(--sp-2); align-items: center; padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--c-line); background: var(--c-surface-2); flex-wrap: wrap; }
.tone { display: inline-flex; border: 1px solid var(--c-line-strong); border-radius: var(--r-md); padding: 2px; gap: 2px; background: var(--c-surface); }
.tone button { border: 0; background: transparent; padding: 3px 9px; border-radius: var(--r-sm); font-size: var(--fs-xs); color: var(--c-text-2); }
.tone button[aria-pressed="true"] { background: var(--c-accent-soft); color: var(--c-text); font-weight: var(--fw-medium); }
.sendall { border: 1px solid var(--c-danger-line); background: var(--c-surface); border-radius: var(--r-lg); padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.sendall ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--c-line); border-radius: var(--r-md); }
.sendall li { display: flex; gap: 4px var(--sp-3); padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--c-line); font-size: var(--fs-sm); flex-wrap: wrap; align-items: baseline; }
.sendall li:last-child { border-bottom: 0; }

/* ---------- Spaces ---------- */
.spaces-page { max-width: 1120px; }
.sgroup { display: flex; flex-direction: column; gap: var(--sp-3); }
.sgroup .section-h h2 { font-size: var(--fs-base); }
.tiles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--sp-3); }
.stile { --scol: var(--c-accent); text-align: left; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; box-shadow: var(--c-shadow); transition: border-color var(--dur-fast), transform var(--dur-fast); }
.stile:hover { border-color: color-mix(in srgb, var(--scol) 55%, var(--c-line)); }
.stile-h { display: flex; gap: var(--sp-2); align-items: center; min-width: 0; }
.stile-name { font-weight: var(--fw-semibold); flex: 1; min-width: 0; line-height: 1.25; overflow-wrap: anywhere; }
.stile-h { align-items: flex-start; } .stile-h .emblem { margin-top: -2px; }
.stile-status { font-size: var(--fs-sm); color: var(--c-text-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stile-meta { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--fs-xs); color: var(--c-text-3); flex-wrap: nowrap; margin-top: auto; min-width: 0; }
.stile-next { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asof { flex: none; }
.stile-next { color: var(--c-text); font-weight: var(--fw-medium); }
.asof { margin-left: auto; font-family: var(--font-mono); font-size: 10px; }
.stile.recessed { background: transparent; box-shadow: none; border-style: dashed; }
.stile.recessed .stile-name { color: var(--c-text-2); font-weight: var(--fw-medium); }
.stile.recessed .emblem { filter: saturate(.3); opacity: .8; }
.stile.suggest { background: transparent; box-shadow: none; border: 1px dashed var(--c-accent); }
.sgroup.quiet .tiles-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.space-page { max-width: 1000px; }
.space-head { display: flex; flex-direction: column; gap: var(--sp-3); padding-bottom: var(--sp-4); border-bottom: 1px solid var(--c-line); }
.space-head h2 { font-size: var(--fs-xl); letter-spacing: -.01em; }
.space-status { font-size: var(--fs-base); max-width: 64ch; }
.ms-line { display: flex; gap: 0; flex-wrap: wrap; }
.ms-line span { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-xs); color: var(--c-text-3); flex: 1 1 70px; min-width: 0; }
.ms-line span i { height: 4px; background: var(--c-surface-3); margin-right: 3px; border-radius: 2px; }
.ms-line span.on { color: var(--c-text); }
.ms-line span.on i { background: var(--scol); }
.space-meta { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }
.space-budget { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.lens-bar { display: flex; gap: var(--sp-3); flex-wrap: wrap; justify-content: space-between; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); }
.bcol { background: var(--c-surface-2); border-radius: var(--r-lg); padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.bcol h3 { font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
.bcard { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-md); padding: var(--sp-3); display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
.bcard b { font-weight: var(--fw-medium); }
.bmeta { display: flex; gap: var(--sp-2); align-items: center; justify-content: space-between; flex-wrap: wrap; }
.wait { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-xs); color: var(--c-info); border-top: 1px dashed var(--c-line); padding-top: 6px; }
.wait span { display: inline-flex; gap: 4px; align-items: center; }
.tline { list-style: none; margin: 0; padding: 0 0 0 4px; display: flex; flex-direction: column; }
.tline li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--sp-4); padding: 8px 0 8px 18px; position: relative; font-size: var(--fs-sm); border-left: 2px solid var(--c-surface-3); }
.tline li::before { content: ""; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--c-surface); border: 2px solid var(--c-line-strong); }
.tline li.past { color: var(--c-text-2); border-left-color: var(--scol); }
.tline li.past::before { background: var(--scol); border-color: var(--scol); }
.tline li.today { font-weight: var(--fw-semibold); }
.tline li.today::before { border-color: var(--c-text); background: var(--c-text); }
.tline .mono { color: var(--c-text-3); }
.clist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--c-line); border-radius: var(--r-lg); background: var(--c-surface); }
.clist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--sp-3); align-items: center; padding: var(--sp-2) var(--sp-4); border-bottom: 1px solid var(--c-line); font-size: var(--fs-sm); }
.clist li:last-child { border-bottom: 0; }
.clist label { display: flex; gap: var(--sp-3); align-items: center; cursor: pointer; min-width: 0; }
.clist input { accent-color: var(--c-accent); width: 16px; height: 16px; flex: none; }
.struck { text-decoration: line-through; color: var(--c-text-3); }
.export { border-color: var(--c-accent); }

/* ---------- capture sheet ---------- */
.veil { position: absolute; inset: 0; background: color-mix(in srgb, var(--c-text) 30%, transparent); z-index: 25; }
.sheet { position: absolute; z-index: 26; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow: auto; background: var(--c-surface); border: 1px solid var(--c-line-strong); border-radius: var(--r-lg); box-shadow: var(--c-shadow); padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-4); animation: sheetIn .24s cubic-bezier(.2, .8, .2, 1); }
@keyframes sheetIn { from { transform: translate(-50%, calc(-50% + 12px)); } }
.sheet .row:has(.btn.primary) { position: sticky; bottom: calc(-1 * var(--sp-5)); background: var(--c-surface); padding-block: var(--sp-2) var(--sp-3); margin-bottom: calc(-1 * var(--sp-3)); border-top: 1px solid var(--c-line); z-index: 2; }
.cap-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.cap-top h2 { font-size: var(--fs-lg); }
.rec-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); padding: var(--sp-3) 0; color: var(--c-text-2); }
.rec-btn { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--c-accent-soft); display: grid; place-items: center; padding: 0; }
.rec-core { width: 72px; height: 72px; border-radius: 50%; background: var(--c-accent); color: var(--c-accent-ink); display: grid; place-items: center; transition: transform var(--dur-fast); }
.rec-btn:hover .rec-core { transform: scale(1.04); }
.rec-btn.on { background: var(--c-danger-soft); animation: breathe 1.8s ease-in-out infinite; }
.rec-btn.on .rec-core { background: var(--c-danger); }
.rec-sq { width: 22px; height: 22px; border-radius: 4px; background: var(--c-surface); }
@keyframes breathe { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--c-danger) 10%, transparent); } }
.rec-timer { font-size: var(--fs-lg); color: var(--c-danger); }
.wave { display: flex; align-items: center; gap: 3px; height: 64px; padding: 0 var(--sp-2); background: var(--c-surface-2); border-radius: var(--r-md); }
.wave i { flex: 1; min-width: 2px; background: var(--c-danger); border-radius: 2px; transition: height .2s; opacity: .85; }
.cap-priv { display: flex; gap: 6px; align-items: center; justify-content: center; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.checklist li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; font-size: var(--fs-sm); color: var(--c-text-3); }
.checklist li.done { color: var(--c-text); }
.checklist li.now { color: var(--c-text); font-weight: var(--fw-medium); }

  function mdRender(s) {
    const lines = s.split("\n"); let out = "", inList = false;
    const inl = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>");
    lines.forEach((l) => {
      if (l.startsWith("- ")) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inl(l.slice(2))}</li>`; return; }
      if (inList) { out += "</ul>"; inList = false; }
      if (l.startsWith("## ")) out += `<h2>${inl(l.slice(3))}</h2>`;
      else if (l.startsWith("# ")) out += `<h1>${inl(l.slice(2))}</h1>`;
      else if (l.trim()) out += `<p>${inl(l)}</p>`;
    });
    if (inList) out += "</ul>";
    return out;
  }

  function qrSvg() {
    let seed = 7; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
    const n = 25; let r = "";
    const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (finder(x, y)) continue;
      if (rnd() > 0.52) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
    }
    const fp = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#FFFFFF"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3"/>`;
    return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" fill="#14201B" role="img" aria-label="Pairing QR code (example)">${r}${fp(0, 0)}${fp(n - 7, 0)}${fp(0, n - 7)}</svg>`;
  }

    if (d.pause) {
      const a = A(d.pause);
      if (a.status === "paused") { a.status = a.prev || "idle"; toast(`${a.name} resumed.`); }
      else { a.prev = a.status; a.status = "paused"; toast(`${a.name} paused. Schedules and triggers are held.`); }
      render(true); return;
    }
    if (d.run) { state.logOpen = state.logOpen === d.run ? null : d.run; render(true); return; }
    if (d.replay) return replay(d.replay);
    if (d.filter) { const [g, v] = d.filter.split(":"); state.logFilter[g] = v; render(true); return; }
    if (d.mem) { state.memFile = d.mem; state.memEditing = false; state.memConfirmDel = false; state.memViewing = true; render(true); return; }
    if (d.install) { state.installTpl = d.install; go("install"); return; }
    if (d.spendmode) { state.spendMode = d.spendmode; render(true); return; }
    const act = d.act; if (!act) return;
    switch (act) {
      case "deploy": state.deployed = true; render(); toast("Deployed to later.sam-k.workers.dev"); break;
      case "savekey": { const v = document.getElementById("api-key").value.trim(); if (!v && !state.keySaved) { toast("Paste a key that starts with sk-ant-"); return; } state.keySaved = true; render(); toast("Saved to your Cloudflare account as a secret."); break; }
      case "onb-back": state.onbStep = Math.max(0, state.onbStep - 1); render(); break;
      case "onb-next":
        if (state.onbStep === 5) { go("today"); toast("Your first Today deck is ready."); }
        else { state.onbStep++; render(); if (state.onbStep === 3 && state.learnStep < learnSteps.length) startLearning(); }
        break;
      case "reset-approvals": state.approvals = approvalsSeed.map((a) => ({ ...a })); state.resolved = {}; A("inbox").status = "approval"; render(); break;
      case "takeover": state.browser = "takeover"; render(); toast("You have control. Research Analyst is paused."); break;
      case "handback": state.browser = "running"; render(); toast("Handed back to Research Analyst."); break;
      case "stop-browser": state.browser = "stopped"; render(); toast("Stopped. The run is logged."); break;
      case "restart-browser": state.browser = "running"; render(); break;
      case "mem-edit": state.memEditing = true; render(true); break;
      case "mem-cancel": state.memEditing = false; render(true); break;
      case "mem-save": memFiles[state.memFile].body = document.getElementById("mem-text").value; memFiles[state.memFile].by = "You"; memFiles[state.memFile].when = "just now"; state.memEditing = false; render(true); toast("Saved. Agents see the new version on their next run."); break;
      case "mem-del": state.memConfirmDel = true; render(true); break;
      case "mem-del-no": state.memConfirmDel = false; render(true); break;
      case "mem-del-yes": state.memDeleted[state.memFile] = true; state.memConfirmDel = false; render(true); toast("File deleted."); break;
      case "mem-close": state.memViewing = false; render(true); break;
      case "install": state.installed[state.installTpl] = true; render(true); toast("Space created. Its routines are paused until you turn them on."); break;
      case "pair": state.paired = true; render(true); toast("iPhone paired. Push notifications are on."); break;
      case "del-ask": state.deleteConfirm = true; render(true); break;
      case "del-cancel": state.deleteConfirm = false; render(true); break;
      case "del-go": { const v = document.getElementById("del-confirm").value.trim(); if (v !== "delete my data") { toast("Type the phrase exactly to confirm."); return; } state.deleteConfirm = false; render(true); toast("Prototype: nothing was deleted."); break; }
      case "deck-skip": todayCards.forEach((c) => { if (!isHandled(c)) { if (c.type === "approval") { state.approvals = state.approvals.filter((a) => a.id !== c.ap); state.resolved[c.ap] = "approve"; } else state.handled[c.id] = "Handled"; } }); render(); break;
      case "deck-reset": state.handled = {}; if (!state.approvals.some((a) => a.id === "ap-1043")) state.approvals.splice(2, 0, { ...approvalsSeed[2] }); render(); break;
      case "snooze-menu": state.snoozeOpen = !state.snoozeOpen; render(true); break;
      case "sw-undo": swipeUndo(state.screen === "review" ? "review" : "triage"); break;
      case "coach-ok": state.coachSeen = true; store.set("later-proto-coach", "1"); render(true); break;
      case "coach-show": state.coachSeen = false; render(true); break;
      case "sendall-open": state.sendAll = true; render(true); break;
      case "sendall-cancel": state.sendAll = false; render(true); break;
      case "sendall-go": { const n = state.drafts.length; state.drafts = []; state.sendAll = false; render(); toast(`Sent ${n} emails. Each is logged in Activity.`); break; }
      case "kitchen-yes": state.kitchen = { id: "kitchen", sc: "read", name: "Kitchen renovation", kind: "Project", icon: "house", st: "ok", needs: 0, status: "Made from 6 items: 3 quotes, 2 Pinterest boards, 1 email from Lena the builder.", asof: "just now", next: "", agents: ["inbox"], budget: [0, 3] }; render(true); toast("Created Kitchen renovation with 6 items."); break;
      case "kitchen-no": state.kitchen = null; state.kitchenDismissed = true; render(true); toast("OK. I'll keep them in Inbox."); break;
      case "many": state.many = !state.many; render(); break;
      case "space-chat": state.dmAgent = SP(state.spaceId).agents ? SP(state.spaceId).agents[0] : "inbox"; state.dmCtx = { type: "task", title: "Space: " + SP(state.spaceId).name, space: state.spaceId }; go("dm"); break;
      case "discuss-space": state.dmAgent = "inbox"; state.dmCtx = { type: "task", title: SP(state.spaceId).name, space: state.spaceId }; go("dm"); break;
      case "toast-light": toast("Marked done (lighter demo content)."); break;
      case "export-open": state.exporting = true; render(true); break;
      case "export-close": state.exporting = false; render(true); break;
      case "export-go": state.exporting = false; render(true); toast("Prototype: this would save later.template.json with personal data stripped."); break;
      case "ctx-clear": state.dmCtx = null; render(true); break;
      case "capture-open": document.getElementById("toast").classList.remove("show"); state.capture = { stage: "idle" }; render(true); break;
      case "cap-close": stopRecTimers(); if (state.capture && state.capture.stage === "extract") toast("Not filed. Your note is kept in Inbox."); state.capture = null; render(true); break;
      case "cap-type": state.capture = { stage: "type" }; render(true); { const ta = document.getElementById("cap-text"); if (ta) ta.focus(); } break;
      case "cap-voice": case "cap-again": state.capture = { stage: "idle" }; render(true); break;
      case "cap-rec": state.capture = { stage: "recording" }; render(true); startRecTimers(); break;
      case "cap-stop": capStop(); break;
      case "cap-raw": state.capture.raw = true; render(true); break;
      case "cap-clean": state.capture.raw = false; render(true); break;
      case "cap-extract": state.capture = { stage: "extract", items: extractSeed() }; render(true); break;
      case "cap-fileall": { const it = state.capture.items; const by = {}; it.forEach((x) => { by[x.space] = (by[x.space] || 0) + 1; }); state.lastFiled = it; state.capture = null; render(true); toast("Filed: " + Object.entries(by).map(([s, n]) => `${n} in ${SP(s).name}`).join(", ") + ".", "capture"); break; }
      case "cap-submit": { const txt = (document.getElementById("cap-text").value || "").trim(); if (!txt) { toast("Type something first."); return; } state.capture = { stage: "filed", text: txt, space: fileGuess(txt) }; render(true); break; }
      case "cap-pick": state.capture.picking = !state.capture.picking; render(true); break;
      case "cap-undo": if (state.capture.stage === "extract") state.capture = { stage: "result", raw: false }; else state.capture = { stage: "type", text: state.capture.text }; render(true); toast("Undone. Nothing was filed."); break;
    }
  });
  app.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "cap-range") { state.cap = +t.value; document.getElementById("cap-val").textContent = "$" + t.value; }
    if (t.dataset.scrub) {
      const ol = document.getElementById("steps-" + t.dataset.scrub); const k = +t.value;
      [...ol.children].forEach((li, j) => { li.classList.toggle("dim", j >= k); li.classList.toggle("on", j === k - 1); });
      const l = document.getElementById("scrub-lbl"); if (l) l.textContent = `${k}/${ol.children.length}`;
    }
    if (t.dataset.cap) {
      const a = A(t.dataset.cap); const v = parseFloat(t.value); if (!(v > 0)) return;
      a.cap = v;
      const tr = t.closest("tr"); const p = pct(a);
      const m = tr.querySelector(".meter"); m.className = "meter lg " + meterCls(p); m.querySelector("i").style.width = Math.min(p, 100) + "%";
      tr.querySelector(".meter-line span:last-child").textContent = p.toFixed(0) + "% of cap";
    }
  });
  app.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.cap) { render(true); toast("Cap saved."); }
    if (t.dataset.ldone) { state.listDone[t.dataset.ldone] = t.checked; render(true); }
    if (t.dataset.routine) state.routines[t.dataset.routine] = t.checked;
    if (t.name === "lane") { state.lane = t.value; toast("Execution lane set. Applies from the next run."); }
    if (t.name === "tpl") state.template = t.value;
  });
  document.getElementById("toast").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tundo]"); if (!b) return;
    const k = b.dataset.tundo;
    if (k === "capture") { state.lastFiled = null; toast("Undone. Nothing was filed."); return; }
    swipeUndo(k);
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") { if (state.capture) { stopRecTimers(); state.capture = null; render(true); } else if (state.moreOpen || state.snoozeOpen) { state.moreOpen = null; state.snoozeOpen = false; render(true); } return; }
    const k = e.key.toLowerCase();
    if (state.screen === "triage" || state.screen === "review") {
      const kind = state.screen;
      if (state.snoozeOpen && kind === "triage" && ["1", "2", "3"].includes(k)) { swipeAct("triage", "snooze:" + snoozeOpts[+k - 1][0]); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); swipeAct(kind, kind === "triage" ? "reply" : "accept"); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); swipeAct(kind, kind === "triage" ? "ignore" : "keep"); }
      else if (k === "u") swipeUndo(kind);
      else if (kind === "triage" && k === "s") { state.snoozeOpen = !state.snoozeOpen; render(true); }
      else if (kind === "triage" && k === "m") swipeAct("triage", "mute");
      else if (kind === "review" && k === "p") swipeAct("review", "pause");
      else if (kind === "review" && k === "a") swipeAct("review", "archive");
    }
  });

  /* ---------------- chrome ---------------- */
  sel.addEventListener("change", () => go(sel.value));
  const step = (dir) => { const i = screens.findIndex(([id]) => id === state.screen); go(screens[(i + dir + screens.length) % screens.length][0]); };
  document.getElementById("prev-screen").onclick = () => step(-1);
  document.getElementById("next-screen").onclick = () => step(1);

  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  function setDevice(d) {
    state.device = d;
    document.getElementById("stage").classList.toggle("phone", d === "phone");
    document.getElementById("dev-desktop").setAttribute("aria-pressed", d === "desktop");
    document.getElementById("dev-phone").setAttribute("aria-pressed", d === "phone");
    store.set("later-proto-device", d);
  }
  document.getElementById("dev-desktop").onclick = () => setDevice("desktop");
  document.getElementById("dev-phone").onclick = () => setDevice("phone");
  function setTheme(t) {
    if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
    document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.themeSet === t));
    store.set("later-proto-theme", t);
    if (state.screen === "tokens") render(true);
  }
  document.querySelectorAll("[data-theme-set]").forEach((b) => (b.onclick = () => setTheme(b.dataset.themeSet)));

  const savedTheme = store.get("later-proto-theme"); if (savedTheme && savedTheme !== "system") setTheme(savedTheme);
  const savedDev = store.get("later-proto-device"); if (savedDev === "phone") setDevice("phone");
  const h = location.hash.slice(1);
  try { if (store.get("later-proto-coach") === "1") state.coachSeen = true; } catch (e) {}
  state.screen = renderers[h] ? h : "today";
  if (state.screen === "capture") state.capture = { stage: "idle" };
  render();
})();
</script>

<style>
/* Layout concept: a quiet instrument panel. Prototype chrome on top, the app in a frame below.
   The app reads its own frame width (container queries), so the same markup is the desktop
   layout in a wide frame and the phone layout in a 390px frame or on a real phone.
   Plex Sans for interface, Plex Mono for anything exact: tool calls, money, tokens, scopes. */
:root {
  /* colour: neutrals lean slightly green-grey toward the pine accent */
  --c-bg: #F4F6F5;
  --c-surface: #FFFFFF;
  --c-surface-2: #EDF1EF;
  --c-surface-3: #E3E9E6;
  --c-line: #D9E0DC;
  --c-line-strong: #BCC6C1;
  --c-text: #14201B;
  --c-text-2: #47554F;
  --c-text-3: #63706A;
  --c-accent: #1D5B50;
  --c-accent-hover: #164A41;
  --c-accent-ink: #FFFFFF;
  --c-accent-soft: #DFEDE8;
  --c-focus: #2C7A6B;
  --c-ok: #2C7148;
  --c-ok-soft: #E0F0E5;
  --c-warn: #8A5A00;
  --c-warn-soft: #FAEFD6;
  --c-warn-line: #E7C77D;
  --c-danger: #A8372B;
  --c-danger-soft: #FAE6E2;
  --c-danger-line: #E4ABA3;
  --c-info: #355C88;
  --c-info-soft: #E3EBF5;
  --c-paused: #5A6863;
  --c-agent-1: #2F6B8F;
  --c-agent-2: #7A5A2F;
  --c-agent-3: #5B5A8C;
  --c-chrome-bg: #14201B;
  --c-chrome-text: #E6ECE9;
  --c-chrome-muted: #98A6A0;
  --c-chrome-line: #2C3A34;
  --c-device: #1B2421;
  --c-shadow: 0 1px 2px rgba(20,32,27,.06), 0 4px 16px rgba(20,32,27,.06);
  --c-site-bg: #FBFAF7;
  --c-site-ink: #23211C;
  --c-site-accent: #C2542D;
  /* Space colours: stable per Space */
  --sc-house: #B5541C; --sc-job: #2D5DA8; --sc-yt: #B8323F; --sc-japan: #8E44A8; --sc-tax: #7A6A12; --sc-health: #2B8255; --sc-fin: #12788A; --sc-mum: #C03A78; --sc-side: #5A4FCF; --sc-read: #8A5A35; --sc-work: #4A5A6A; --sc-inbox: #6B7671; --sc-kitchen: #8A5A35; --sc-_all: #63706A;

  /* type */
  --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --fs-xs: 0.75rem;   /* 12 */
  --fs-sm: 0.8125rem; /* 13 */
  --fs-md: 0.875rem;  /* 14 */
  --fs-base: 0.9375rem; /* 15 */
  --fs-lg: 1.125rem;  /* 18 */
  --fs-xl: 1.375rem;  /* 22 */
  --fs-2xl: 1.75rem;  /* 28 */
  --lh-tight: 1.25;
  --lh-body: 1.5;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;

  /* space (4px base) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* radii */
  --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-pill: 999px; --r-device: 44px;

  /* motion */
  --dur-fast: 120ms; --dur-med: 220ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --c-bg: #0E1311; --c-surface: #151B19; --c-surface-2: #1B2320; --c-surface-3: #222C28;
    --c-line: #28332F; --c-line-strong: #3A4742;
    --c-text: #E5ECE8; --c-text-2: #AAB7B1; --c-text-3: #8B9893;
    --c-accent: #73C3AF; --c-accent-hover: #8CD3C0; --c-accent-ink: #0A1613; --c-accent-soft: #1A322C; --c-focus: #8CD3C0;
    --c-ok: #74C893; --c-ok-soft: #173023;
    --c-warn: #E6B556; --c-warn-soft: #33280F; --c-warn-line: #6B5420;
    --c-danger: #F1897C; --c-danger-soft: #3A1C18; --c-danger-line: #6E3129;
    --c-info: #92B5E2; --c-info-soft: #1A2738;
    --c-paused: #9AA8A2;
    --c-agent-1: #7FB4D6; --c-agent-2: #D2AE7B; --c-agent-3: #A9A8DA;
    --c-chrome-bg: #080B0A; --c-chrome-text: #E5ECE8; --c-chrome-muted: #8B9893; --c-chrome-line: #222B28;
    --c-device: #2A3431;
    --c-shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --c-site-bg: #1E1D1A; --c-site-ink: #ECE8DF; --c-site-accent: #E7895F;
    --sc-house: #E58A55; --sc-job: #7FA6E8; --sc-yt: #EC7A84; --sc-japan: #C489DD; --sc-tax: #CDBB5A; --sc-health: #6FC898; --sc-fin: #5EC1D2; --sc-mum: #EE85B4; --sc-side: #9C93F2; --sc-read: #CFA17A; --sc-work: #9DADBE; --sc-inbox: #9AA59F; --sc-kitchen: #CFA17A; --sc-_all: #8B9893;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --c-bg: #0E1311; --c-surface: #151B19; --c-surface-2: #1B2320; --c-surface-3: #222C28;
  --c-line: #28332F; --c-line-strong: #3A4742;
  --c-text: #E5ECE8; --c-text-2: #AAB7B1; --c-text-3: #8B9893;
  --c-accent: #73C3AF; --c-accent-hover: #8CD3C0; --c-accent-ink: #0A1613; --c-accent-soft: #1A322C; --c-focus: #8CD3C0;
  --c-ok: #74C893; --c-ok-soft: #173023;
  --c-warn: #E6B556; --c-warn-soft: #33280F; --c-warn-line: #6B5420;
  --c-danger: #F1897C; --c-danger-soft: #3A1C18; --c-danger-line: #6E3129;
  --c-info: #92B5E2; --c-info-soft: #1A2738;
  --c-paused: #9AA8A2;
  --c-agent-1: #7FB4D6; --c-agent-2: #D2AE7B; --c-agent-3: #A9A8DA;
  --c-chrome-bg: #080B0A; --c-chrome-text: #E5ECE8; --c-chrome-muted: #8B9893; --c-chrome-line: #222B28;
  --c-device: #2A3431;
  --c-shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --c-site-bg: #1E1D1A; --c-site-ink: #ECE8DF; --c-site-accent: #E7895F;
    --sc-house: #E58A55; --sc-job: #7FA6E8; --sc-yt: #EC7A84; --sc-japan: #C489DD; --sc-tax: #CDBB5A; --sc-health: #6FC898; --sc-fin: #5EC1D2; --sc-mum: #EE85B4; --sc-side: #9C93F2; --sc-read: #CFA17A; --sc-work: #9DADBE; --sc-inbox: #9AA59F; --sc-kitchen: #CFA17A; --sc-_all: #8B9893;
  color-scheme: dark;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--c-bg); color: var(--c-text);
  font-family: var(--font-sans); font-size: var(--fs-md); line-height: var(--lh-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 var(--sp-6);
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--c-chrome-bg); }
h1, h2, h3, h4 { margin: 0; font-weight: var(--fw-semibold); line-height: var(--lh-tight); text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--c-text-2); }
.faint { color: var(--c-text-3); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.label { font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--c-text-3); font-weight: var(--fw-medium); }
a { color: var(--c-accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- prototype chrome ---------- */
.proto {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--sp-2);
  background: var(--c-chrome-bg); color: var(--c-chrome-text);
  border-bottom: 1px solid var(--c-chrome-line);
}
.proto-in { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); max-width: 1440px; margin: 0 auto; }
.proto-brand { display: flex; align-items: baseline; gap: var(--sp-2); font-weight: var(--fw-semibold); }
.proto-brand small { font-family: var(--font-mono); font-weight: 400; font-size: var(--fs-xs); color: var(--c-chrome-muted); }
.proto-nav { display: flex; align-items: center; gap: var(--sp-2); flex: 1 1 260px; min-width: 0; }
.proto select {
  flex: 1 1 auto; min-width: 0; max-width: 300px; appearance: none;
  background: transparent; color: var(--c-chrome-text);
  border: 1px solid var(--c-chrome-line); border-radius: var(--r-md);
  padding: 6px 28px 6px 10px; font-size: var(--fs-sm);
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat;
}
.proto select option { background: var(--c-chrome-bg); color: var(--c-chrome-text); }
.icon-btn-c { border: 1px solid var(--c-chrome-line); background: transparent; color: var(--c-chrome-text); border-radius: var(--r-md); width: 32px; height: 32px; display: grid; place-items: center; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--c-chrome-line); border-radius: var(--r-md); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--c-chrome-muted); padding: 4px 10px; border-radius: var(--r-sm); font-size: var(--fs-sm); }
.seg button[aria-pressed="true"] { background: var(--c-chrome-line); color: var(--c-chrome-text); }
.proto-tools { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

/* ---------- stage & frames ---------- */
.stage { max-width: 1440px; margin: var(--sp-4) auto 0; display: flex; justify-content: center; }
.frame {
  container-type: inline-size; container-name: frame;
  width: 100%; height: max(600px, calc(100dvh - 96px)); max-height: 980px;
  background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg);
  overflow: hidden; box-shadow: var(--c-shadow); position: relative;
}
.stage.phone .frame {
  width: 390px; max-width: 100%; height: 844px; max-height: none;
  border: 10px solid var(--c-device); border-radius: var(--r-device);
}
.stage.phone .frame::before { /* speaker notch */
  content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  width: 96px; height: 24px; border-radius: 14px; background: var(--c-device); z-index: 5;
}
.stage.phone .app { padding-top: 34px; }
@media (max-width: 520px) {
  .stage.phone .frame { border-width: 0; border-radius: var(--r-lg); height: max(600px, calc(100dvh - 130px)); border: 1px solid var(--c-line); }
  .stage.phone .frame::before { display: none; }
  .stage.phone .app { padding-top: 0; }
  .frame { height: max(600px, calc(100dvh - 130px)); }
}
.stage-note { max-width: 1440px; margin: var(--sp-3) auto 0; font-size: var(--fs-xs); color: var(--c-text-3); text-align: center; }

/* ---------- app shell ---------- */
.app { height: 100%; display: grid; grid-template-columns: 260px minmax(0,1fr); grid-template-rows: minmax(0,1fr); background: var(--c-bg); }
.app.no-shell { grid-template-columns: minmax(0,1fr); }
.side { background: var(--c-surface); border-right: 1px solid var(--c-line); display: flex; flex-direction: column; min-height: 0; overflow: auto; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-4) var(--sp-3); }
.wordmark { display: flex; align-items: center; gap: var(--sp-2); font-weight: var(--fw-semibold); font-size: var(--fs-lg); letter-spacing: -.01em; }
.wordmark-mark { width: 22px; height: 22px; border-radius: var(--r-sm); background: var(--c-accent); position: relative; flex: none; }
.wordmark-mark::after { content: ""; position: absolute; left: 6px; top: 5px; width: 8px; height: 10px; border-left: 2px solid var(--c-accent-ink); border-bottom: 2px solid var(--c-accent-ink); }
.host-chip { font-family: var(--font-mono); font-size: 11px; color: var(--c-text-3); padding: 0 var(--sp-4) var(--sp-3); display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-ok); display: inline-block; flex: none; }
.nav { display: flex; flex-direction: column; gap: 1px; padding: 0 var(--sp-2); }
.nav button { display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: left; border: 0; background: transparent; padding: 7px var(--sp-3); border-radius: var(--r-md); color: var(--c-text-2); }
.nav button:hover { background: var(--c-surface-2); color: var(--c-text); }
.nav button[aria-current="page"] { background: var(--c-accent-soft); color: var(--c-text); font-weight: var(--fw-medium); }
.nav button svg { flex: none; }
.badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--c-warn-soft); color: var(--c-warn); font-size: var(--fs-xs); font-weight: var(--fw-semibold); display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; border: 1px solid var(--c-warn-line); }
.badge[data-zero="true"] { background: var(--c-surface-2); color: var(--c-text-3); border-color: var(--c-line); }
.side-section { padding: var(--sp-5) var(--sp-4) var(--sp-2); display: flex; justify-content: space-between; align-items: center; }
.agent-list { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--sp-2) var(--sp-4); }
.agent-row { display: grid; grid-template-columns: 32px minmax(0,1fr); gap: var(--sp-3); align-items: start; padding: var(--sp-2) var(--sp-2); border-radius: var(--r-md); border: 0; background: transparent; text-align: left; width: 100%; }
.agent-row:hover { background: var(--c-surface-2); }
.agent-row[aria-current="page"] { background: var(--c-surface-2); }
.agent-row .name { font-weight: var(--fw-medium); display: flex; align-items: center; gap: var(--sp-2); }
.agent-row .meta { font-size: var(--fs-xs); color: var(--c-text-3); display: flex; gap: 6px; flex-wrap: wrap; }
.side-foot { margin-top: auto; border-top: 1px solid var(--c-line); padding: var(--sp-3) var(--sp-4); }

.avatar { width: 32px; height: 32px; border-radius: var(--r-md); display: grid; place-items: center; font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--c-surface); flex: none; letter-spacing: .02em; }
.avatar.lg { width: 40px; height: 40px; font-size: var(--fs-sm); }
.avatar.a1 { background: var(--c-agent-1); } .avatar.a2 { background: var(--c-agent-2); } .avatar.a3 { background: var(--c-agent-3); }
.avatar.you { background: var(--c-surface-3); color: var(--c-text-2); }

.status { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: var(--fw-medium); white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.working { color: var(--c-ok); }
.status.working::before { animation: pulse 1.6s ease-in-out infinite; }
.status.idle { color: var(--c-text-3); }
.status.idle::before { background: transparent; border: 1.5px solid currentColor; }
.status.paused { color: var(--c-paused); }
.status.paused::before { border-radius: 1px; width: 7px; background: linear-gradient(90deg, currentColor 0 2.5px, transparent 2.5px 4.5px, currentColor 4.5px); }
.status.approval { color: var(--c-warn); }
@keyframes pulse { 50% { opacity: .35; } }

.meter { height: 4px; background: var(--c-surface-3); border-radius: var(--r-pill); position: relative; overflow: visible; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--c-accent); max-width: 100%; }
.meter.warn > i { background: var(--c-warn); }
.meter.over > i { background: var(--c-danger); }
.meter::after { content: ""; position: absolute; left: 80%; top: -2px; bottom: -2px; width: 1px; background: var(--c-line-strong); }
.meter.lg { height: 8px; }
.meter.lg::after { top: -3px; bottom: -3px; }
.meter-line { display: flex; justify-content: space-between; font-size: 11px; color: var(--c-text-3); margin-top: 3px; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

/* main column */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-6); border-bottom: 1px solid var(--c-line); background: var(--c-surface); min-height: 60px; }
.topbar h1 { font-size: var(--fs-lg); }
.topbar .sub { font-size: var(--fs-sm); color: var(--c-text-3); }
.topbar-actions { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.btn.back { display: none; }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.page { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-6); max-width: 1080px; }
.tabbar { display: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--c-line-strong); background: var(--c-surface); color: var(--c-text); padding: 6px 12px; border-radius: var(--r-md); font-size: var(--fs-sm); font-weight: var(--fw-medium); white-space: nowrap; transition: background var(--dur-fast); min-height: 32px; }
.btn:hover { background: var(--c-surface-2); }
.btn.primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-accent-ink); }
.btn.primary:hover { background: var(--c-accent-hover); }
.btn.danger { color: var(--c-danger); border-color: var(--c-danger-line); }
.btn.danger:hover { background: var(--c-danger-soft); }
.btn.danger-solid { background: var(--c-danger); border-color: var(--c-danger); color: var(--c-surface); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--c-text-2); }
.btn.ghost:hover { background: var(--c-surface-2); color: var(--c-text); }
.btn.lg { padding: 10px 18px; font-size: var(--fs-md); min-height: 40px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* panels */
.panel { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-line); flex-wrap: wrap; }
.panel-h h2, .panel-h h3 { font-size: var(--fs-md); }
.panel-b { padding: var(--sp-4); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }
.section-h h2 { font-size: var(--fs-lg); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: var(--r-pill); font-size: var(--fs-xs); border: 1px solid var(--c-line); background: var(--c-surface-2); color: var(--c-text-2); white-space: nowrap; }
.chip.mono { font-family: var(--font-mono); font-size: 11px; }
.tier { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: var(--r-sm); font-size: var(--fs-xs); font-weight: var(--fw-semibold); letter-spacing: .02em; white-space: nowrap; }
.tier.irr { background: var(--c-danger-soft); color: var(--c-danger); border: 1px solid var(--c-danger-line); }
.tier.rev { background: var(--c-info-soft); color: var(--c-info); border: 1px solid var(--c-line); }
.tier.read { background: var(--c-surface-2); color: var(--c-text-2); border: 1px solid var(--c-line); }
.callout { display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); font-size: var(--fs-sm); border: 1px solid var(--c-line); background: var(--c-surface-2); color: var(--c-text-2); align-items: flex-start; }
.callout svg { flex: none; margin-top: 2px; }
.callout.warn { background: var(--c-warn-soft); border-color: var(--c-warn-line); color: var(--c-text); }
.callout.warn svg { color: var(--c-warn); }
.callout.danger { background: var(--c-danger-soft); border-color: var(--c-danger-line); color: var(--c-text); }
.callout.danger svg { color: var(--c-danger); }
.callout.accent { background: var(--c-accent-soft); border-color: transparent; color: var(--c-text); }
.callout.accent svg { color: var(--c-accent); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--fs-sm); font-weight: var(--fw-medium); }
.input { border: 1px solid var(--c-line-strong); background: var(--c-surface); border-radius: var(--r-md); padding: 8px 10px; width: 100%; min-width: 0; }
.input:focus { outline: 2px solid var(--c-focus); outline-offset: -1px; }
textarea.input { resize: vertical; line-height: 1.55; }
.kv { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 6px var(--sp-4); font-size: var(--fs-sm); }
.kv dt { color: var(--c-text-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--sp-4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--sp-4); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--sp-4); }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.row { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.tbl th { text-align: left; font-weight: var(--fw-medium); color: var(--c-text-3); font-size: var(--fs-xs); letter-spacing: .04em; text-transform: uppercase; padding: var(--sp-2) var(--sp-4); border-bottom: 1px solid var(--c-line); white-space: nowrap; }
.tbl td { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- home ---------- */
.home { display: grid; grid-template-columns: minmax(0,1fr) 300px; height: 100%; min-height: 0; }
.channel { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--c-line); }
.thread { flex: 1; overflow: auto; padding: var(--sp-5) var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); min-height: 0; }
.msg { display: grid; grid-template-columns: 32px minmax(0,1fr); gap: var(--sp-3); }
.msg-h { display: flex; gap: var(--sp-2); align-items: baseline; flex-wrap: wrap; }
.msg-h b { font-weight: var(--fw-semibold); }
.msg-h time { font-size: var(--fs-xs); color: var(--c-text-3); font-variant-numeric: tabular-nums; }
.msg-body { display: flex; flex-direction: column; gap: var(--sp-2); max-width: 68ch; min-width: 0; }
.msg-body p { line-height: 1.55; }
.msg.you .msg-body p { }
.day-sep { display: flex; align-items: center; gap: var(--sp-3); font-size: var(--fs-xs); color: var(--c-text-3); }
.day-sep::before, .day-sep::after { content: ""; flex: 1; height: 1px; background: var(--c-line); }
.composer { border-top: 1px solid var(--c-line); padding: var(--sp-3) var(--sp-6) var(--sp-4); background: var(--c-surface); }
.composer-box { border: 1px solid var(--c-line-strong); border-radius: var(--r-lg); padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3); display: flex; gap: var(--sp-2); align-items: flex-end; background: var(--c-surface); }
.composer-box textarea { border: 0; flex: 1; resize: none; background: transparent; min-height: 36px; padding: 7px 0; outline: none; min-width: 0; }
.composer-hint { font-size: var(--fs-xs); color: var(--c-text-3); margin-top: 6px; display: flex; gap: var(--sp-3); flex-wrap: wrap; }
.aside { overflow: auto; padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-5); background: var(--c-surface); min-height: 0; }
.big-num { font-size: var(--fs-2xl); font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.1; }
.big-num small { font-size: var(--fs-md); color: var(--c-text-3); font-weight: var(--fw-regular); letter-spacing: 0; }
.mini-agents { display: none; }
.ref { font-family: var(--font-mono); font-size: 11px; text-decoration: none; border: 1px solid var(--c-line); background: var(--c-surface-2); color: var(--c-accent); padding: 0 5px; border-radius: var(--r-sm); vertical-align: 1px; white-space: nowrap; }
.ref:hover { border-color: var(--c-accent); }
.sources { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-xs); color: var(--c-text-3); border-top: 1px dashed var(--c-line); padding-top: var(--sp-2); }
.sources a { color: var(--c-text-2); text-decoration: none; overflow-wrap: anywhere; }
.sources a:hover { color: var(--c-accent); text-decoration: underline; }
.sources .mono { color: var(--c-accent); }

/* action timeline */
details.timeline { border: 1px solid var(--c-line); border-radius: var(--r-md); background: var(--c-surface); font-size: var(--fs-sm); }
details.timeline > summary { list-style: none; cursor: pointer; padding: 7px var(--sp-3); display: grid; grid-template-columns: 12px minmax(0,1fr) auto; align-items: center; gap: 2px var(--sp-2); color: var(--c-text-2); }
details.timeline > summary::-webkit-details-marker { display: none; }
details.timeline > summary .chev { transition: transform var(--dur-fast); }
details.timeline[open] > summary .chev { transform: rotate(90deg); }
details.timeline > summary .cost { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--c-text-3); }
.steps { list-style: none; margin: 0; padding: var(--sp-1) var(--sp-3) var(--sp-3) var(--sp-3); display: flex; flex-direction: column; border-top: 1px solid var(--c-line); }
.step { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: var(--sp-2); align-items: baseline; padding: 5px 0; position: relative; }
.step::before { content: ""; position: absolute; left: 7px; top: 20px; bottom: -6px; width: 1px; background: var(--c-line); }
.step:last-child::before { display: none; }
.step .pip { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--c-text-3); background: var(--c-surface); margin-left: 3px; position: relative; top: 1px; }
.step.k-write .pip { border-color: var(--c-info); }
.step.k-irr .pip { border-color: var(--c-danger); background: var(--c-danger-soft); }
.step.k-untrusted .pip { border-color: var(--c-warn); background: var(--c-warn-soft); }
.step.k-model .pip { border-color: var(--c-accent); }
.step .t { font-family: var(--font-mono); font-size: 11px; color: var(--c-text-3); }
.step .detail { display: block; font-size: var(--fs-xs); color: var(--c-text-3); font-family: var(--font-mono); overflow-wrap: anywhere; }
.step.on { background: var(--c-accent-soft); border-radius: var(--r-sm); }
.step.dim { opacity: .4; }

/* ---------- approval cards ---------- */
.queue { display: flex; flex-direction: column; gap: var(--sp-4); }
.acard { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); overflow: hidden; transition: opacity var(--dur-med), transform var(--dur-med); }
.acard.leaving { opacity: 0; transform: translateX(16px); }
.acard.untrusted { border-color: var(--c-warn-line); }
.acard-flag { display: flex; gap: var(--sp-2); align-items: flex-start; padding: var(--sp-2) var(--sp-4); background: var(--c-warn-soft); border-bottom: 1px solid var(--c-warn-line); font-size: var(--fs-sm); }
.acard-flag svg { color: var(--c-warn); flex: none; margin-top: 2px; }
.acard-h { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-4) var(--sp-4) var(--sp-3); flex-wrap: wrap; }
.acard-h .what { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.acard-h h3 { font-size: var(--fs-base); }
.acard-h .by { font-size: var(--fs-xs); color: var(--c-text-3); }
.acard-b { padding: 0 var(--sp-4) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.call { border: 1px solid var(--c-line); border-radius: var(--r-md); overflow: hidden; }
.call-h { display: flex; justify-content: space-between; gap: var(--sp-2); padding: 6px var(--sp-3); background: var(--c-surface-2); border-bottom: 1px solid var(--c-line); font-size: 11px; color: var(--c-text-3); flex-wrap: wrap; }
.call-h .mono { color: var(--c-text); font-weight: var(--fw-medium); }
.call-args { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 4px var(--sp-3); padding: var(--sp-3); font-family: var(--font-mono); font-size: 12px; }
.call-args dt { color: var(--c-text-3); }
.call-args dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.call-body { border-top: 1px dashed var(--c-line); padding: var(--sp-3); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; line-height: 1.6; max-height: 220px; overflow: auto; overflow-wrap: anywhere; }
.call-body textarea { width: 100%; min-height: 180px; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.why { font-size: var(--fs-sm); color: var(--c-text-2); display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px var(--sp-3); }
.why b { color: var(--c-text-3); font-weight: var(--fw-medium); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.acard-f { display: flex; gap: var(--sp-2); align-items: center; padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--c-line); background: var(--c-surface-2); flex-wrap: wrap; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--c-text-2); }
.check input { accent-color: var(--c-accent); width: 15px; height: 15px; }
.check.disabled { color: var(--c-text-3); }
.acard-f .check { margin-right: auto; }
.empty { text-align: center; padding: var(--sp-10) var(--sp-4); color: var(--c-text-2); display: flex; flex-direction: column; gap: var(--sp-2); align-items: center; }
.empty .ring { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--c-ok); display: grid; place-items: center; color: var(--c-ok); }
.acard.compact .acard-h { padding: var(--sp-3); }
.acard.compact .acard-b { padding: 0 var(--sp-3) var(--sp-3); }
.acard.compact .acard-f { padding: var(--sp-2) var(--sp-3); }
.resolved { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--fs-sm); padding: var(--sp-2) var(--sp-3); border: 1px solid var(--c-line); border-radius: var(--r-md); color: var(--c-text-2); background: var(--c-surface-2); }

/* ---------- activity ---------- */
.filters { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.fchip { border: 1px solid var(--c-line-strong); background: var(--c-surface); border-radius: var(--r-pill); padding: 3px 12px; font-size: var(--fs-sm); color: var(--c-text-2); }
.fchip[aria-pressed="true"] { background: var(--c-text); color: var(--c-surface); border-color: var(--c-text); }
.log { display: flex; flex-direction: column; }
.log-day { padding: var(--sp-4) 0 var(--sp-2); }
.log-row { display: grid; grid-template-columns: 64px 28px minmax(0,1fr) auto; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-3); border: 1px solid transparent; border-bottom-color: var(--c-line); width: 100%; background: transparent; text-align: left; }
.log-row:hover { background: var(--c-surface); }
.log-row[aria-expanded="true"] { background: var(--c-surface); border-color: var(--c-line); border-radius: var(--r-md) var(--r-md) 0 0; }
.log-row .avatar { width: 28px; height: 28px; font-size: 10px; }
.log-row .t { font-family: var(--font-mono); font-size: 12px; color: var(--c-text-3); font-variant-numeric: tabular-nums; }
.log-row .title { font-weight: var(--fw-medium); }
.log-row .sub { font-size: var(--fs-xs); color: var(--c-text-3); display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }
.log-row .cost { font-family: var(--font-mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.log-row .cost small { display: block; color: var(--c-text-3); font-size: 11px; }
.log-detail { border: 1px solid var(--c-line); border-top: 0; background: var(--c-surface); border-radius: 0 0 var(--r-md) var(--r-md); padding: var(--sp-3) var(--sp-4) var(--sp-4); margin-bottom: var(--sp-2); display: flex; flex-direction: column; gap: var(--sp-3); }
.log-detail .steps { border-top: 0; padding: 0; }
.outcome { font-size: 11px; padding: 0 6px; border-radius: var(--r-sm); border: 1px solid var(--c-line); }
.outcome.ok { color: var(--c-ok); }
.outcome.wait { color: var(--c-warn); border-color: var(--c-warn-line); }
.outcome.no { color: var(--c-danger); border-color: var(--c-danger-line); }
.scrub { display: flex; align-items: center; gap: var(--sp-3); }
.scrub input[type=range] { flex: 1; accent-color: var(--c-accent); min-width: 0; }

/* ---------- spend ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--sp-4); }
.tile { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.tile .big-num { font-size: var(--fs-xl); }
.est { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-family: var(--font-mono); color: var(--c-text-3); border: 1px dashed var(--c-line-strong); border-radius: var(--r-sm); padding: 0 5px; white-space: nowrap; }
.cap-input { display: inline-flex; align-items: center; border: 1px solid var(--c-line-strong); border-radius: var(--r-md); background: var(--c-surface); padding-left: 8px; width: 92px; }
.cap-input span { color: var(--c-text-3); font-family: var(--font-mono); font-size: 12px; }
.cap-input input { border: 0; background: transparent; width: 100%; padding: 5px 6px; font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; outline: none; min-width: 0; }
.cap-input:focus-within { outline: 2px solid var(--c-focus); outline-offset: -1px; }
.bars { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: var(--sp-2); }
.bars-y { display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--c-text-3); text-align: right; height: 140px; }
.bars-plot { position: relative; height: 140px; display: grid; grid-template-columns: repeat(30, minmax(0,1fr)); gap: 3px; align-items: end; border-bottom: 1px solid var(--c-line-strong); background-image: linear-gradient(var(--c-line) 1px, transparent 1px); background-size: 100% 25%; }
.bars-plot i { display: block; background: var(--c-accent); border-radius: 2px 2px 0 0; min-height: 1px; }
.bars-plot i.proj { background: transparent; border: 1px dashed var(--c-line-strong); border-bottom: 0; }
.bars-plot i.today { background: var(--c-accent); outline: 2px solid var(--c-accent-soft); }
.bars-x { grid-column: 2; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--c-text-3); }
.rule { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0; border: 1px solid var(--c-line); border-radius: var(--r-lg); overflow: hidden; background: var(--c-surface); }
.rule > div { padding: var(--sp-4); border-right: 1px solid var(--c-line); display: flex; flex-direction: column; gap: 4px; }
.rule > div:last-child { border-right: 0; }
.rule .pct { font-family: var(--font-mono); font-size: var(--fs-lg); font-weight: 500; }
.legend { display: flex; gap: var(--sp-4); font-size: var(--fs-xs); color: var(--c-text-3); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--c-accent); display: inline-block; }
.legend i.dash { background: transparent; border: 1px dashed var(--c-line-strong); }
.model-bar { display: flex; height: 10px; border-radius: var(--r-pill); overflow: hidden; gap: 2px; }
.model-bar i { display: block; height: 100%; }
.m-haiku { background: var(--c-agent-1); } .m-sonnet { background: var(--c-accent); } .m-opus { background: var(--c-agent-3); }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: -1px; margin-right: 6px; }

/* ---------- browser ---------- */
.live { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 0; height: 100%; min-height: 0; }
.live-view { padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; overflow: auto; }
.bwin { border: 1px solid var(--c-line-strong); border-radius: var(--r-lg); overflow: hidden; background: var(--c-site-bg); position: relative; box-shadow: var(--c-shadow); }
.bwin-bar { display: flex; gap: var(--sp-2); align-items: center; padding: 8px var(--sp-3); background: var(--c-surface-2); border-bottom: 1px solid var(--c-line); }
.bwin-bar .url { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-pill); padding: 3px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--c-text-2); }
.bwin-bar .lights { display: flex; gap: 5px; }
.bwin-bar .lights i { width: 9px; height: 9px; border-radius: 50%; background: var(--c-line-strong); display: block; }
.site { color: var(--c-site-ink); padding: var(--sp-5) var(--sp-6) var(--sp-8); font-family: Georgia, "Times New Roman", serif; position: relative; min-height: 380px; }
.site-nav { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-sans); font-size: 12px; opacity: .8; gap: var(--sp-3); flex-wrap: wrap; }
.site-logo { font-weight: 700; font-size: 16px; font-family: Georgia, serif; letter-spacing: -.02em; }
.site h2 { font-size: 26px; font-weight: 400; margin: var(--sp-6) 0 var(--sp-1); }
.site .lede { font-family: var(--font-sans); font-size: 13px; opacity: .75; }
.plans { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--sp-3); margin-top: var(--sp-5); font-family: var(--font-sans); }
.plan { border: 1px solid color-mix(in srgb, var(--c-site-ink) 18%, transparent); border-radius: 8px; padding: var(--sp-3); display: flex; flex-direction: column; gap: 6px; font-size: 12px; position: relative; min-width: 0; }
.plan b { font-size: 13px; }
.plan .price { font-family: Georgia, serif; font-size: 22px; }
.plan .price small { font-family: var(--font-sans); font-size: 11px; opacity: .7; }
.plan ul { margin: 0; padding-left: 16px; opacity: .8; display: flex; flex-direction: column; gap: 2px; }
.plan .cta { margin-top: 4px; border-radius: 5px; padding: 5px; text-align: center; background: var(--c-site-ink); color: var(--c-site-bg); font-size: 11px; }
.plan.hl .cta { background: var(--c-site-accent); }
.agent-focus { position: absolute; inset: -5px; border: 2px solid var(--c-accent); border-radius: 10px; pointer-events: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c-accent) 18%, transparent); }
.agent-focus span { position: absolute; top: -11px; left: 8px; background: var(--c-accent); color: var(--c-accent-ink); font-family: var(--font-mono); font-size: 10px; padding: 1px 6px; border-radius: var(--r-sm); white-space: nowrap; }
.cursor { position: absolute; width: 14px; height: 20px; pointer-events: none; transition: left .6s, top .6s; }
.takeover-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--sp-2) var(--sp-3); background: var(--c-warn-soft); border-top: 1px solid var(--c-warn-line); color: var(--c-text); font-family: var(--font-sans); font-size: var(--fs-sm); display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.stopped-veil { position: absolute; inset: 0; background: color-mix(in srgb, var(--c-bg) 82%, transparent); display: grid; place-items: center; text-align: center; font-family: var(--font-sans); padding: var(--sp-4); }
.narr { border-left: 1px solid var(--c-line); background: var(--c-surface); display: flex; flex-direction: column; min-height: 0; }
.narr-h { padding: var(--sp-4); border-bottom: 1px solid var(--c-line); display: flex; flex-direction: column; gap: var(--sp-2); }
.narr-list { flex: 1; overflow: auto; padding: var(--sp-3) var(--sp-4); list-style: none; margin: 0; display: flex; flex-direction: column; gap: var(--sp-3); counter-reset: n; min-height: 0; }
.narr-list li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: var(--sp-2); font-size: var(--fs-sm); counter-increment: n; }
.narr-list li::before { content: counter(n); font-family: var(--font-mono); font-size: 11px; color: var(--c-text-3); width: 20px; height: 20px; border: 1px solid var(--c-line); border-radius: 50%; display: grid; place-items: center; }
.narr-list li.now::before { border-color: var(--c-accent); color: var(--c-accent); }
.narr-list li.now { color: var(--c-text); font-weight: var(--fw-medium); }
.narr-list li.done { color: var(--c-text-2); }
.narr-list li .t { font-family: var(--font-mono); font-size: 11px; color: var(--c-text-3); font-weight: 400; display: block; }
.narr-f { padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--c-line); display: flex; gap: var(--sp-2); }
.narr-f .btn { flex: 1; }

/* ---------- memory ---------- */
.mem { display: grid; grid-template-columns: 260px minmax(0,1fr); height: 100%; min-height: 0; }
.mem-list { border-right: 1px solid var(--c-line); overflow: auto; background: var(--c-surface); padding: var(--sp-3) var(--sp-2); min-height: 0; }
.mem-group { padding: var(--sp-3) var(--sp-2) var(--sp-1); display: flex; align-items: center; gap: var(--sp-2); }
.mem-file { display: flex; justify-content: space-between; gap: var(--sp-2); width: 100%; border: 0; background: transparent; padding: 6px var(--sp-2) 6px var(--sp-6); border-radius: var(--r-md); text-align: left; font-family: var(--font-mono); font-size: 12px; color: var(--c-text-2); }
.mem-file:hover { background: var(--c-surface-2); }
.mem-file[aria-current="true"] { background: var(--c-accent-soft); color: var(--c-text); }
.mem-file small { color: var(--c-text-3); font-size: 11px; }
.mem-view { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mem-view-h { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-5); border-bottom: 1px solid var(--c-line); flex-wrap: wrap; }
.mem-view-h .path { font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: var(--fw-medium); overflow-wrap: anywhere; min-width: 0; }
.mem-body { flex: 1; overflow: auto; padding: var(--sp-5); min-height: 0; }
.md { max-width: 68ch; display: flex; flex-direction: column; gap: var(--sp-3); line-height: 1.6; }
.md h1 { font-size: var(--fs-xl); } .md h2 { font-size: var(--fs-base); margin-top: var(--sp-2); }
.md ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.md code { font-family: var(--font-mono); font-size: 12px; background: var(--c-surface-2); padding: 0 4px; border-radius: 3px; }
.mem-edit { width: 100%; height: 100%; min-height: 360px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; }

/* ---------- templates ---------- */
.tcards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--sp-4); }
.tcard { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.tcard h3 { font-size: var(--fs-base); }
.tcard p { color: var(--c-text-2); font-size: var(--fs-sm); }
.tcard .facts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--sp-2); border-top: 1px solid var(--c-line); padding-top: var(--sp-3); font-size: var(--fs-xs); }
.tcard .facts b { display: block; font-size: var(--fs-sm); font-weight: var(--fw-medium); font-family: var(--font-mono); }
.tcard .facts span { color: var(--c-text-3); }
.tcard-f { display: flex; gap: var(--sp-2); align-items: center; margin-top: auto; flex-wrap: wrap; }
.perm-list { list-style: none; margin: 0; padding: 0; }
.perm-list li { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: var(--sp-3); align-items: start; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--c-line); }
.perm-list li:last-child { border-bottom: 0; }
.perm-list .mono { font-size: 12px; color: var(--c-text-2); overflow-wrap: anywhere; }
.install-bar { position: sticky; bottom: 0; background: var(--c-surface); border-top: 1px solid var(--c-line); padding: var(--sp-3) var(--sp-6); display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; }

/* ---------- settings ---------- */
.conn { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: var(--sp-3); align-items: start; padding: var(--sp-4); border-bottom: 1px solid var(--c-line); }
.conn:last-child { border-bottom: 0; }
.conn-logo { width: 36px; height: 36px; border-radius: var(--r-md); border: 1px solid var(--c-line); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--c-text-2); background: var(--c-surface-2); }
.scopes { display: grid; grid-template-columns: 140px minmax(0,1fr); gap: 4px var(--sp-3); margin-top: var(--sp-2); font-size: var(--fs-xs); }
.scopes dt { color: var(--c-text-3); }
.scopes dd { margin: 0; display: flex; gap: 4px; flex-wrap: wrap; }
.lanes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--sp-3); }
.lane { border: 1px solid var(--c-line-strong); border-radius: var(--r-lg); padding: var(--sp-4); display: grid; grid-template-columns: 18px minmax(0,1fr); gap: var(--sp-3); cursor: pointer; background: var(--c-surface); }
.lane:has(input:checked) { border-color: var(--c-accent); box-shadow: 0 0 0 1px var(--c-accent); background: var(--c-accent-soft); }
.lane input { accent-color: var(--c-accent); margin-top: 3px; }
.lane.off { opacity: .6; cursor: not-allowed; }
.lane h4 { font-size: var(--fs-md); display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.lane p { font-size: var(--fs-sm); color: var(--c-text-2); }
.lane .cost { font-family: var(--font-mono); font-size: 12px; color: var(--c-text); }
.qr-wrap { display: grid; grid-template-columns: auto minmax(0,1fr); gap: var(--sp-5); align-items: start; }
.qr { width: 156px; height: 156px; padding: 10px; background: #FFFFFF; border-radius: var(--r-md); border: 1px solid var(--c-line); }
.qr svg { display: block; width: 100%; height: 100%; }
.danger-zone { border-color: var(--c-danger-line); }

/* ---------- onboarding ---------- */
.onb { height: 100%; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: var(--sp-8) var(--sp-5); gap: var(--sp-6); background: var(--c-bg); }
.onb-top { width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); }
.stepper { width: 100%; max-width: 640px; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--sp-2); list-style: none; padding: 0; margin: 0; }
.stepper li { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-xs); color: var(--c-text-3); }
.stepper li::before { content: ""; height: 3px; border-radius: 2px; background: var(--c-line); }
.stepper li.done::before, .stepper li.cur::before { background: var(--c-accent); }
.stepper li.cur { color: var(--c-text); font-weight: var(--fw-medium); }
.onb-card { width: 100%; max-width: 640px; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); padding: var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-5); }
.onb-card h1 { font-size: var(--fs-2xl); letter-spacing: -.015em; }
.onb-card .lead { color: var(--c-text-2); font-size: var(--fs-base); max-width: 56ch; }
.onb-f { display: flex; justify-content: space-between; gap: var(--sp-3); align-items: center; border-top: 1px solid var(--c-line); padding-top: var(--sp-5); flex-wrap: wrap; }
.creates { list-style: none; margin: 0; padding: 0; border: 1px solid var(--c-line); border-radius: var(--r-md); }
.creates li { display: flex; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--c-line); font-size: var(--fs-sm); flex-wrap: wrap; }
.creates li:last-child { border-bottom: 0; }
.creates .mono { font-size: 12px; color: var(--c-text-2); }
.deploy-btn { display: inline-flex; align-items: center; gap: var(--sp-3); align-self: flex-start; }
.progress { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); font-family: var(--font-mono); }
.progress div { display: flex; gap: var(--sp-2); align-items: center; }
.progress .ok { color: var(--c-ok); }
.key-row { display: flex; gap: var(--sp-2); }
.key-row .input { font-family: var(--font-mono); font-size: 13px; }
.cap-big { display: flex; align-items: baseline; gap: var(--sp-2); }
.cap-big .big-num { font-size: 40px; }
input[type=range].cap { width: 100%; accent-color: var(--c-accent); }
.credit { display: grid; grid-template-columns: auto minmax(0,1fr); gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--c-line); border-radius: var(--r-md); background: var(--c-surface-2); }
.credit .ring { width: 40px; height: 40px; }
.pick { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--sp-3); }
.pick label { border: 1px solid var(--c-line-strong); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); display: grid; grid-template-columns: 18px minmax(0,1fr); gap: var(--sp-2); cursor: pointer; font-size: var(--fs-sm); }
.pick label:has(input:checked) { border-color: var(--c-accent); box-shadow: 0 0 0 1px var(--c-accent); background: var(--c-accent-soft); }
.pick input { accent-color: var(--c-accent); margin-top: 3px; }
.pick b { display: block; font-size: var(--fs-md); }
.pick span { color: var(--c-text-2); }

/* ---------- tokens ---------- */
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--sp-3); }
.swatch { border: 1px solid var(--c-line); border-radius: var(--r-md); overflow: hidden; background: var(--c-surface); font-size: 11px; font-family: var(--font-mono); min-width: 0; }
.swatch i { display: block; height: 44px; border-bottom: 1px solid var(--c-line); }
.swatch div { padding: 6px 8px; display: flex; flex-direction: column; overflow-wrap: anywhere; }
.swatch span { color: var(--c-text-3); }
.tok-row { display: grid; grid-template-columns: 140px 90px minmax(0,1fr); gap: var(--sp-3); align-items: center; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line); font-family: var(--font-mono); font-size: 12px; }
.tok-row .v { color: var(--c-text-3); }
.tok-row .demo { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: var(--font-sans); }

/* ---------- toast ---------- */
.toast { position: absolute; left: 50%; bottom: var(--sp-5); transform: translateX(-50%) translateY(8px); background: var(--c-text); color: var(--c-surface); padding: 8px 14px; border-radius: var(--r-md); font-size: var(--fs-sm); opacity: 0; pointer-events: none; transition: opacity var(--dur-med), transform var(--dur-med); z-index: 30; max-width: calc(100% - 32px); box-shadow: var(--c-shadow); }
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.has-undo.show { pointer-events: auto; }
.toast.has-undo { display: flex; gap: 12px; align-items: center; }
.toast-undo { border: 0; background: transparent; color: var(--c-accent-soft); font-weight: 600; text-decoration: underline; padding: 0; }

/* ---------- shared bits for cards, Spaces, capture ---------- */
.linkbtn { border: 0; background: none; padding: 0; color: var(--c-accent); font-size: var(--fs-sm); text-decoration: underline; text-underline-offset: 2px; }
.btn.icon-only { padding: 6px; min-width: 32px; }
.badge.soft { background: var(--c-surface-2); color: var(--c-text-2); border-color: var(--c-line); }
.seg-in { display: inline-flex; border: 1px solid var(--c-line-strong); border-radius: var(--r-md); padding: 2px; gap: 2px; background: var(--c-surface); flex: none; }
.seg-in button { border: 0; background: transparent; padding: 4px 10px; border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--c-text-2); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.seg-in button[aria-pressed="true"] { background: var(--c-accent-soft); color: var(--c-text); font-weight: var(--fw-medium); }
.seg-in .cnt { font-family: var(--font-mono); font-size: 11px; color: var(--c-text-3); }
.emblem { --scol: var(--c-text-3); width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; flex: none; color: var(--scol); background: color-mix(in srgb, var(--scol) 15%, var(--c-surface)); border: 1px solid color-mix(in srgb, var(--scol) 28%, transparent); }
.emblem.sm { width: 20px; height: 20px; border-radius: 5px; }
.emblem.lg { width: 40px; height: 40px; border-radius: 10px; }
.emblem.xl { width: 48px; height: 48px; border-radius: 12px; }
.stag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: var(--fw-medium); color: var(--c-text); white-space: nowrap; min-width: 0; }
.schip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: var(--fw-semibold); padding: 1px 7px; border-radius: var(--r-pill); white-space: nowrap; border: 1px solid var(--c-line); color: var(--c-text-2); background: var(--c-surface); }
.schip.needs { color: var(--c-warn); background: var(--c-warn-soft); border-color: var(--c-warn-line); }
.schip.ok { color: var(--c-ok); background: var(--c-ok-soft); border-color: transparent; }
.schip.wait { color: var(--c-info); background: var(--c-info-soft); border-color: transparent; }
.schip.stalled { color: var(--c-danger); background: transparent; border-color: var(--c-danger-line); }
.schip.quiet, .schip.paused { color: var(--c-text-3); background: transparent; }
.avatar.person { background: var(--c-surface-3); color: var(--c-text-2); }
.owner { display: inline-flex; align-items: center; gap: 5px; }
.owner .avatar { width: 20px; height: 20px; font-size: 8px; border-radius: 5px; }
.msdots { display: inline-flex; gap: 3px; align-items: center; }
.msdots i { width: 14px; height: 4px; border-radius: 2px; background: var(--c-surface-3); }
.msdots i.on { background: var(--scol, var(--c-accent)); }
.menu { position: absolute; right: 0; bottom: calc(100% + 4px); z-index: 15; min-width: 220px; background: var(--c-surface); border: 1px solid var(--c-line-strong); border-radius: var(--r-md); box-shadow: var(--c-shadow); padding: 4px; display: flex; flex-direction: column; }
.menu button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: var(--r-sm); font-size: var(--fs-sm); display: flex; gap: 6px; align-items: center; }
.menu button:hover { background: var(--c-surface-2); }
.more-wrap { position: relative; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--c-line-strong); background: var(--c-surface); border-radius: var(--r-pill); padding: 3px 10px 3px 4px; font-size: var(--fs-xs); }
.chip-btn:hover { border-color: var(--c-accent); }
.pick-spaces { display: flex; flex-wrap: wrap; gap: 6px; }
.ok-chip { color: var(--c-ok); background: var(--c-ok-soft); border-color: transparent; }

/* ---------- card types ---------- */
.t-brief { --tc: var(--c-warn); } .t-digest { --tc: var(--c-info); } .t-meeting { --tc: var(--c-agent-3); } .t-reply { --tc: var(--c-accent); }
.t-monitor { --tc: var(--c-agent-1); } .t-approval { --tc: var(--c-danger); } .t-fyi { --tc: var(--c-ok); } .t-task { --tc: var(--c-text-2); }
.ctype { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: var(--fw-semibold); letter-spacing: .06em; text-transform: uppercase; color: var(--c-text-2); white-space: nowrap; }
.ctype-ic { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--c-surface)); }

/* ---------- Today deck ---------- */
.deck-page { max-width: 680px; margin: 0 auto; padding: var(--sp-5) var(--sp-6) var(--sp-10); display: flex; flex-direction: column; gap: var(--sp-5); }
.deck-head { display: flex; flex-direction: column; gap: var(--sp-2); }
.deck-title { font-size: var(--fs-xl); letter-spacing: -.01em; }
.pips { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
.pips i { height: 4px; border-radius: 2px; background: var(--c-surface-3); transition: background var(--dur-med); }
.pips i.done { background: var(--c-accent); } .pips i.cur { background: var(--c-text-2); }
.deck-list { display: flex; flex-direction: column; gap: var(--sp-4); }
.dcard { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); box-shadow: var(--c-shadow); display: flex; flex-direction: column; animation: settle .32s cubic-bezier(.2, .8, .2, 1) both; position: relative; }
@keyframes settle { from { transform: translateY(8px) scale(.99); } to { transform: none; } }
.dcard-h { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) 0; flex-wrap: wrap; row-gap: 6px; }
.prov { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--c-text-3); white-space: nowrap; }
.prov .avatar { width: 18px; height: 18px; font-size: 8px; border-radius: 4px; }
.dcard-t { padding: var(--sp-2) var(--sp-4) 0; font-size: var(--fs-lg); font-weight: var(--fw-semibold); line-height: 1.3; letter-spacing: -.005em; }
.dcard-b { padding: var(--sp-3) var(--sp-4) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.dcard-f { display: flex; gap: var(--sp-2); align-items: center; padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--c-line); }
.dcard-f .spacer { flex: 1; }
.hrow { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-4); border: 1px dashed var(--c-line-strong); border-radius: var(--r-lg); font-size: var(--fs-sm); color: var(--c-ok); }
.hrow-t { flex: 1; min-width: 0; color: var(--c-text-2); overflow-wrap: anywhere; }
.hrow-t b { font-weight: var(--fw-medium); color: var(--c-text-2); }
.cstack, .fanned { display: flex; flex-direction: column; gap: var(--sp-2); }
.fanned { gap: var(--sp-4); }
.stackw { position: relative; isolation: isolate; margin-bottom: 14px; }
.stackw.peek1::after, .stackw.peek2::after, .stackw.peek2::before { content: ""; position: absolute; left: 12px; right: 12px; bottom: -7px; height: 30px; border: 1px solid var(--c-line); border-top: 0; background: var(--c-surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); z-index: -1; }
.stackw.peek2::before { left: 24px; right: 24px; bottom: -14px; background: var(--c-surface-3); z-index: -2; }
.fan-btn { align-self: flex-start; display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--c-line-strong); background: var(--c-surface); border-radius: var(--r-pill); padding: 4px 12px 4px 5px; font-size: var(--fs-sm); color: var(--c-text-2); }
.fan-btn:hover { border-color: var(--c-accent); color: var(--c-text); }
.deck-endline { text-align: center; font-size: var(--fs-xs); color: var(--c-text-3); padding: var(--sp-3) 0; border-top: 1px solid var(--c-line); }
.end-card { padding: var(--sp-8) var(--sp-6); align-items: center; text-align: center; gap: var(--sp-4); }
.end-ring { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--c-ok); color: var(--c-ok); display: grid; place-items: center; }
.end-card h2, .tri-done h2 { font-size: var(--fs-xl); }
.end-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-5); text-align: left; width: 100%; }
.end-sum { list-style: none; margin: var(--sp-2) 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); color: var(--c-text-2); }
.end-sum li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.end-sum li svg { color: var(--c-ok); flex: none; }
.end-spaces { gap: 4px !important; }
.end-sum.strip li svg { color: var(--c-danger); }
.daystrip { position: relative; height: 26px; background: var(--c-surface-2); border-radius: var(--r-sm); border: 1px solid var(--c-line); }
.daystrip i { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; background: color-mix(in srgb, var(--scol) 35%, var(--c-surface)); border: 1px solid color-mix(in srgb, var(--scol) 60%, transparent); }
.daystrip .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--c-text); border-radius: 1px; }
.daystrip-x { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--c-text-3); margin-top: -6px; }
.top3 { margin: 0; padding: 0; list-style: none; counter-reset: t; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); color: var(--c-text-2); }
.top3 li { counter-increment: t; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--sp-2); align-items: baseline; }
.top3 li::before { content: counter(t); font-family: var(--font-mono); font-size: 11px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--c-line-strong); display: grid; place-items: center; color: var(--c-text-2); }
.top3 b { color: var(--c-text); font-weight: var(--fw-medium); }

.task-meta dd { margin: 0; font-size: var(--fs-sm); font-weight: var(--fw-medium); }
.quotes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-sm); }
.quotes li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 var(--sp-3); }
.quotes li .faint { grid-column: 1 / -1; font-size: var(--fs-xs); }
.quotes li:first-child span:first-child { font-weight: var(--fw-medium); }
.mtg-when { display: flex; gap: var(--sp-3); align-items: baseline; flex-wrap: wrap; }
.mtg-when .mono { font-size: var(--fs-base); font-weight: 500; }
.people-row, .people li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--sp-3); align-items: start; }
.people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
.memline { font-size: var(--fs-xs); color: var(--c-text-2); display: flex; gap: 5px; align-items: center; margin-top: 2px; }
.memline svg { color: var(--c-text-3); flex: none; }
.prep { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-sm); color: var(--c-text-2); }
.facepile { display: flex; } .facepile .avatar { border: 2px solid var(--c-surface); margin-left: -8px; width: 30px; height: 30px; } .facepile .avatar:first-child { margin-left: 0; }
.ba { display: flex; gap: var(--sp-3); align-items: baseline; flex-wrap: wrap; }
.ba .was { font-family: var(--font-mono); font-size: var(--fs-lg); color: var(--c-text-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.ba .now { font-family: var(--font-mono); font-size: 30px; font-weight: 500; line-height: 1; }
.delta { font-family: var(--font-mono); font-size: 12px; color: var(--c-ok); background: var(--c-ok-soft); padding: 1px 6px; border-radius: var(--r-sm); }
.spark { width: 100%; max-width: 100%; height: auto; display: block; }
.dtiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); }
.dtile { border: 1px solid var(--c-line); background: var(--c-surface-2); border-radius: var(--r-md); padding: var(--sp-3); text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dtile:hover { border-color: var(--c-line-strong); }
.dtile[aria-expanded="true"] { grid-column: 1 / -1; background: var(--c-surface); border-color: var(--c-info); }
.dtile .k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--c-info); font-weight: var(--fw-semibold); }
.dtile .h { font-weight: var(--fw-semibold); font-size: var(--fs-sm); line-height: 1.35; }
.dtile .m { font-size: var(--fs-xs); color: var(--c-text-3); }
.dtile .s { font-size: var(--fs-sm); color: var(--c-text-2); }

.dtile .srcs a { display: inline-flex; gap: 4px; align-items: center; text-decoration: none; }
.call-body.clamp { max-height: 4.9em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }

/* ---------- swipe stacks (triage, review) ---------- */
.tri { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.tri-head { padding: var(--sp-3) var(--sp-6) 0; display: flex; flex-direction: column; gap: var(--sp-2); max-width: 580px; width: 100%; margin: 0 auto; }
.tri-stage { flex: 1; min-height: 0; padding: var(--sp-4) var(--sp-6) var(--sp-6); display: flex; justify-content: center; align-items: stretch; position: relative; overflow: hidden; }
.tri-stack { position: relative; width: 100%; max-width: 520px; max-height: 420px; height: 100%; }
.tri-card { position: absolute; inset: 0 0 24px; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); box-shadow: var(--c-shadow); display: flex; flex-direction: column; overflow: hidden; transition: transform .24s cubic-bezier(.2, .8, .2, 1), opacity .24s; touch-action: pan-y; user-select: none; -webkit-user-select: none; --r: 0; --l: 0; }
.tri-card.front { cursor: grab; z-index: 3; }

.tri-card.behind { transform: translateY(12px) scale(.96); z-index: 2; background: var(--c-surface-2); }
.tri-card.behind2 { transform: translateY(24px) scale(.92); z-index: 1; background: var(--c-surface-3); }
.tri-card.behind .tri-in, .tri-card.behind2 .tri-in { opacity: 0; }
.tri-card.ret-r { animation: retR .32s cubic-bezier(.2, .8, .2, 1); }
.tri-card.ret-l { animation: retL .32s cubic-bezier(.2, .8, .2, 1); }
.tri-card.ret-c { animation: settle .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes retR { from { transform: translate(120%, 12px) rotate(12deg); } }
@keyframes retL { from { transform: translate(-120%, 12px) rotate(-12deg); } }
.swipe-tag { position: absolute; top: 42%; padding: 4px 10px; border-radius: var(--r-sm); font-size: var(--fs-sm); font-weight: var(--fw-semibold); border: 2px solid; pointer-events: none; z-index: 4; background: var(--c-surface); display: inline-flex; gap: 6px; align-items: center; }
.swipe-tag.r { left: var(--sp-4); color: var(--c-accent); border-color: var(--c-accent); opacity: var(--r); transform: rotate(-5deg); }
.swipe-tag.l { right: var(--sp-4); color: var(--c-text-2); border-color: var(--c-line-strong); opacity: var(--l); transform: rotate(5deg); }
.tri-in { padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); overflow: auto; flex: 1; transition: opacity .2s; }
.sender { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; }
.sender .avatar { width: 40px; height: 40px; }
.memchip { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-xs); color: var(--c-text-2); background: var(--c-surface-2); border: 1px solid var(--c-line); border-radius: var(--r-sm); padding: 2px 8px; align-self: flex-start; }
.gist { font-size: var(--fs-base); line-height: 1.5; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.why-line { font-size: var(--fs-sm); color: var(--c-text-2); }
.why-line b { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--c-text-3); margin-right: 6px; }
.intents { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: auto; }
.intent { border: 1px solid var(--c-line-strong); background: var(--c-surface); border-radius: var(--r-pill); padding: 5px 12px; font-size: var(--fs-sm); }
.intent[aria-pressed="true"] { background: var(--c-accent-soft); border-color: var(--c-accent); font-weight: var(--fw-medium); }
.rev-dl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px var(--sp-3); margin: 0; font-size: var(--fs-sm); }
.rev-dl dt { color: var(--c-text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
.rev-dl dd { margin: 0; }
.proposal { display: flex; flex-direction: column; gap: 4px; padding: var(--sp-3); border-radius: var(--r-md); background: var(--c-surface-2); border: 1px solid var(--c-line); margin-top: auto; }
.tri-controls { border-top: 1px solid var(--c-line); background: var(--c-surface); padding: var(--sp-3) var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-2); align-items: center; }
.tri-btns { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-2); width: 100%; max-width: 580px; }
.tri-btns .btn.tb { flex-direction: column; gap: 2px; min-height: 58px; font-size: var(--fs-xs); white-space: normal; text-align: center; line-height: 1.2; width: 100%; }

.tri-controls[data-hl="l"] [data-hl-l] { box-shadow: 0 0 0 3px var(--c-surface-3); transform: scale(1.04); }
.tri-btns .btn { transition: transform var(--dur-fast), box-shadow var(--dur-fast); }
.snz { position: relative; }
.snz .menu { left: 0; right: auto; }
.kbd { font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--c-line-strong); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--c-text-3); line-height: 1.4; }
.btn.primary .kbd { color: var(--c-accent-ink); border-color: color-mix(in srgb, var(--c-accent-ink) 50%, transparent); }
.tri-note { font-size: var(--fs-xs); color: var(--c-text-2); display: flex; gap: 6px; align-items: center; text-align: center; }
.tri-note svg { color: var(--c-accent); flex: none; }
.tri-done { padding: var(--sp-8) var(--sp-6); align-items: center; text-align: center; gap: var(--sp-3); max-width: 460px; width: 100%; align-self: center; }
.coach { position: absolute; inset: 0; background: color-mix(in srgb, var(--c-bg) 70%, transparent); display: grid; place-items: center; z-index: 6; padding: var(--sp-4); }
.coach-in { max-width: 320px; background: var(--c-surface); border: 1px solid var(--c-line-strong); border-radius: var(--r-lg); padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-2); align-items: center; text-align: center; box-shadow: var(--c-shadow); }
.coach-hand { color: var(--c-accent); animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: translateX(-10px); } 50% { transform: translateX(14px) rotate(8deg); } }

/* ---------- drafts ---------- */
.drafts-page { max-width: 760px; }
.draft { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
.draft-h { display: flex; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); flex-wrap: wrap; }
.draft-h .who { flex: 1 1 160px; min-width: 0; }

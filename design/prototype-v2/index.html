<style>
/* Layout concept: a calm stone base where colour belongs to Spaces. One card at a time on the phone; on desktop the active card sits centre-stage with the deck on the left and its context on the right. */
/* SYSTEM RULES (pass 3)
   Accent: exactly one chrome accent hue (--accent, cobalt). It marks focus, the active tab, selection, progress and links. Primary actions are ink.
   Exception, stated: Space identity colours (--sc) are content, not accents. They tint a Space's own cover, emblem and progress, never a chrome control.
   Semantic colours (ok / warn / risk) mean state only and are not accents.
   Greys: one warm stone family, light and dark.
   Shape: radius scale 4 / 8 / 12 / 16 / 24 / 32 / pill / circle. Tracks 4. Small marks and kbd 8. Inner tiles 12. List cards 16. Panels 24. Deck cards and sheets 32.
   Actions, chips, inputs and toasts are pills. People are circles. Emblems: 8 up to 28px, 12 up to 40px, 16 above. The device bezel in prototype chrome is not product UI.
   Gradients: four, each with a job. Hatched free time on the day rail, hatched 'not created yet' on a suggested Space, the fade on a clipped message, and the swipe-direction tint. No decorative washes.
   Motion: press 120ms scale .97; narrative 220-280ms strong ease-out; finger-driven motion is a spring (duration 400, damping 1; sheets 300 / .8). */
:root{
  color-scheme: light;
  --stage:#E4E2DC; --bg:#F2F1EC; --surface:#FFFFFF; --surface-2:#F8F7F3; --sunken:#EAE8E2;
  --line:rgba(30,27,22,.10); --line-2:rgba(30,27,22,.18);
  --ink:#1C1B18; --ink-2:#4A4740; --ink-3:#625E56; --ink-inv:#FFFFFF;
  --btn:#1C1B18; --btn-ink:#FFFFFF;
  --accent:#2B50C8; --accent-bg:#E6EBFA; --on-accent:#FFFFFF; --on-risk:#FFFFFF;
  --ok:#256B3B; --ok-bg:#E2F0E5; --warn:#8F5400; --warn-bg:#FAEBD1; --risk:#B02A21; --risk-bg:#FBE4E0; --info:var(--accent);
  --chrome:#DAD8D1; --chrome-ink:#2B2924;
  --e1:0 1px 2px rgba(30,26,20,.06),0 1px 1px rgba(30,26,20,.04);
  --e2:0 10px 24px -10px rgba(30,26,20,.20),0 2px 6px rgba(30,26,20,.06);
  --e3:0 30px 60px -24px rgba(30,26,20,.32),0 8px 18px -6px rgba(30,26,20,.10);
  --hl:inset 0 0 0 1px rgba(30,27,22,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --t-hero:40px; --t-h1:32px; --t-h2:25px; --t-h3:20px; --t-lg:17px; --t-md:15px; --t-sm:13px; --t-xs:12px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-2xl:32px; --r-pill:999px;
  --d-fast:120ms; --d-base:220ms; --d-slow:280ms;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-spring:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.65,0,.35,1);
}

  color-scheme: dark;
  --stage:#0A0A09; --bg:#121110; --surface:#1C1B19; --surface-2:#22211E; --sunken:#0E0D0C;
  --line:rgba(255,250,240,.09); --line-2:rgba(255,250,240,.16);
  --ink:#F2F0EA; --ink-2:#C6C2B8; --ink-3:#A29D92; --ink-inv:#1C1B18;
  --btn:#F2F0EA; --btn-ink:#1C1B18;

  --ok:#72C690; --ok-bg:#15281C; --warn:#F0B65A; --warn-bg:#2E2311; --risk:#FF8F84; --risk-bg:#361714;
  --chrome:#050505; --chrome-ink:#CBC7BE;
  --e1:0 1px 2px rgba(0,0,0,.5);
  --e2:0 12px 28px -10px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.4);
  --e3:0 34px 70px -24px rgba(0,0,0,.85),0 8px 18px -6px rgba(0,0,0,.5);
  --hl:inset 0 0 0 1px rgba(255,250,240,.07);
}}

  color-scheme: dark;
  --stage:#0A0A09; --bg:#121110; --surface:#1C1B19; --surface-2:#22211E; --sunken:#0E0D0C;

  --ink:#F2F0EA; --ink-2:#C6C2B8; --ink-3:#A29D92; --ink-inv:#1C1B18;

  --accent:#93AAFF; --accent-bg:#1E2540; --on-accent:#10152B; --on-risk:#2A0B08;
  --ok:#72C690; --ok-bg:#15281C; --warn:#F0B65A; --warn-bg:#2E2311; --risk:#FF8F84; --risk-bg:#361714;

  --e3:0 34px 70px -24px rgba(0,0,0,.85),0 8px 18px -6px rgba(0,0,0,.5);

}
*{box-sizing:border-box}

.mono{font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:0}

/* ---------- prototype chrome ---------- */
.chrome{height:44px;display:flex;align-items:center;gap:var(--s2);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--chrome);color:var(--chrome-ink);font-size:13px;position:relative;z-index:50}

#stage{height:calc(100% - 44px);position:relative}
.mode-desk{height:100%}
.mode-frame{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;overflow:auto;padding-block:24px;background:var(--stage)}
.device{width:414px;height:868px;border-radius:64px;padding:12px;background:#0B0C0D;box-shadow:0 0 0 2px #2A2C30,0 40px 80px -30px rgba(0,0,0,.55),0 10px 30px -10px rgba(0,0,0,.35);flex:none;position:relative}
.device::after{content:"";position:absolute;top:24px;left:50%;width:120px;height:34px;border-radius:24px;background:#000;transform:translateX(-50%);z-index:40;pointer-events:none}

.try{width:260px;font-size:13px;color:var(--ink-2)}

@media (max-width:1080px){.try{display:none}}
.mode-bare{height:100%}
.mode-bare .ph-status{height:6px;padding:0}
.mode-bare .ph-status>*{display:none!important}
@media (max-height:960px){.mode-frame .device{zoom:.9}}
.mode-bare .phone{border-radius:0;height:100%;width:100%}

/* ---------- phone shell ---------- */
.phone{width:390px;height:844px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.ph-status{height:47px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px 34px;font-weight:600;font-size:15px;position:relative;z-index:30}
.mode-bare .ph-status{height:6px;padding:0}
.ph-status .sig{display:flex;gap:6px;align-items:center}
.ph-body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.ph-body.noscroll,.main.noscroll{overflow:hidden}
.ph-body::-webkit-scrollbar{display:none}
.ph-pad{padding:4px 16px 120px}
.tabbar{position:absolute;left:12px;right:12px;bottom:20px;display:flex;gap:10px;align-items:center;z-index:25;pointer-events:none}
.mode-bare .tabbar{bottom:max(12px,env(safe-area-inset-bottom,0px))}
.tabs{flex:1;height:64px;border-radius:var(--r-pill);background:color-mix(in oklab,var(--surface) 92%,transparent);box-shadow:var(--e2),var(--hl);display:flex;align-items:center;justify-content:space-around;padding:0 6px;pointer-events:auto;backdrop-filter:saturate(1.4) blur(14px)}
.tabs button{flex:1;height:52px;border-radius:var(--r-pill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);position:relative;transition:background var(--d-fast)}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-bg)}
.tabs .dot{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--risk);color:var(--on-risk);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.cap-btn{width:64px;height:64px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;box-shadow:var(--e2);pointer-events:auto;transition:transform var(--d-fast) var(--ease-out)}
.cap-btn:active{transform:scale(.94)}

/* ---------- desktop shell ---------- */
.desk{display:grid;grid-template-columns:248px 1fr;height:100%;background:var(--bg)}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px 16px;gap:4px;overflow:auto;background:var(--surface-2)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:12px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.nav-i{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:12px;color:var(--ink-2);font-weight:500;width:100%;text-align:left}
.nav-i:hover{background:var(--sunken)}
.nav-i[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--e1),var(--hl)}.nav-i[aria-current="page"]>svg{color:var(--accent)}
.nav-i .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3)}
.nav-i .n.hot{background:var(--risk);color:var(--on-risk);border-radius:8px;padding:1px 7px}
.side-h{margin:18px 10px 6px}
.side .capture-d{margin-top:8px;height:44px;border-radius:16px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start}
.main{overflow:auto;position:relative;min-width:0}
.dhead{display:flex;align-items:flex-end;gap:16px;padding:28px 36px 20px}
.dhead h1{margin:0;font-family:var(--f-display);font-size:var(--t-h1);line-height:1.05;letter-spacing:-.025em;font-weight:700}

/* ---------- shared atoms ---------- */
.btn{height:44px;padding:0 18px;border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform var(--d-fast) var(--ease-out),background var(--d-fast),box-shadow var(--d-fast)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--btn);color:var(--btn-ink)}
.btn.sec{background:var(--sunken);color:var(--ink)}
.btn.ghost{color:var(--ink-2)}
.btn.ghost:hover,.btn.sec:hover{background:color-mix(in oklab,var(--ink) 10%,transparent)}
.btn.line{box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.icon{width:44px;padding:0}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn.risk{background:var(--risk);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-pill);background:var(--sunken);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.pill-st{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.02em}
.pill-st.needs{background:var(--warn-bg);color:var(--warn)}
.pill-st.ok{background:var(--ok-bg);color:var(--ok)}
.pill-st.wait{background:var(--sunken);color:var(--ink-2)}
.pill-st.stalled{background:var(--risk-bg);color:var(--risk)}
.pill-st.quiet{background:var(--sunken);color:var(--ink-3)}
.pill-st.paused{background:var(--warn-bg);color:var(--warn)}
.emb{--z:28px;width:var(--z);height:var(--z);border-radius:var(--rz,8px);background:var(--sc);color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.22)}
.stag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);min-width:0}
.stag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.agent .am{width:18px;height:18px;border-radius:8px;background:var(--sunken);display:grid;place-items:center;color:var(--ink)}
.av{border-radius:50%;flex:none;overflow:hidden;display:block}
.av.ini{display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);font-weight:700;letter-spacing:.02em;box-shadow:var(--hl)}
.av.org{display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);box-shadow:var(--hl)}
.pile{display:flex}
.pile>*{margin-left:-10px;box-shadow:0 0 0 2.5px var(--surface);border-radius:50%}
.pile>*:first-child{margin-left:0}
.bar{height:6px;border-radius:4px;background:var(--sunken);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--sc,var(--ink))}
.ms{display:flex;gap:3px}
.ms i{flex:1;height:5px;border-radius:4px;background:color-mix(in oklab,var(--sc) 22%,var(--sunken))}
.ms i.on{background:var(--sc)}
.hr{height:1px;background:var(--line);border:0;margin:0}
.toast{position:absolute;left:50%;bottom:var(--toast-b,104px);transform:translate(-50%,16px);opacity:0;background:var(--btn);color:var(--btn-ink);border-radius:var(--r-pill);padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;box-shadow:var(--e3);transition:opacity var(--d-base),transform var(--d-base) var(--ease-out);z-index:60;white-space:nowrap;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{height:32px;padding:0 12px;border-radius:var(--r-pill);background:color-mix(in oklab,var(--btn-ink) 16%,transparent);font-weight:600;font-size:13px}
.phone.notabs .toast{--toast-b:28px}.phone.hasctl .toast{--toast-b:136px}
.desk .toast,.mode-desk>.toast{bottom:28px}
.desk .toast.show,.mode-desk>.toast.show{transform:translate(-50%,0)}
.sheet-bg{position:absolute;inset:0;background:rgba(10,12,14,.38);z-index:70;animation:fade var(--d-base) var(--ease-out)}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--surface);border-radius:32px;padding:8px 16px 16px;z-index:71;box-shadow:var(--e3);animation:sheetUp var(--d-slow) var(--ease-out)}

.desk .sheet{left:50%;right:auto;bottom:auto;top:50%;width:420px;transform:translate(-50%,-50%);animation:pop var(--d-base) var(--ease-out)}

</style>
<style>
/* ---------- headers ---------- */

/* ---------- Today deck ---------- */

.prov button{height:28px;padding:0 10px;border-radius:var(--r-pill);font-weight:600;color:var(--accent);position:relative}
.prov button::after{content:"";position:absolute;inset:-8px -2px}
.guests{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.dc-foot{display:flex;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line);align-items:center;position:relative;background:var(--surface)}
.dc-foot .btn.pri{flex:1}
.more-menu{position:absolute;right:12px;bottom:68px;background:var(--surface);border-radius:16px;box-shadow:var(--e3),var(--hl);padding:6px;min-width:220px;z-index:5;animation:rise var(--d-base) var(--ease-out)}
.more-menu button{display:flex;width:100%;height:44px;align-items:center;gap:10px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:500;text-align:left}
.more-menu button:hover{background:var(--sunken)}

.cv{position:relative}
.cv>svg.cover,.thumb>svg.cover{position:absolute;inset:0;width:100%;height:100%;display:block}
/* brief */
.ds-track{position:relative;height:56px;margin:22px 2px 0}
.ds-track .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.ds-free{position:absolute;top:6px;bottom:6px;border-radius:12px;background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--ok) 16%,transparent) 0 5px,transparent 5px 10px);box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--ok) 45%,transparent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap}
.ds-ev{position:absolute;top:6px;bottom:6px;border-radius:8px;min-width:10px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.2)}
.ds-now{position:absolute;top:-18px;bottom:0;width:2px;margin-left:-1px;background:var(--ink);border-radius:4px}
.ds-now::before{content:"";position:absolute;top:-1px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.ds-now span{position:absolute;top:-5px;left:9px;font-family:var(--f-mono);font-size:11px;white-space:nowrap;color:var(--ink)}
.ds-axis{position:relative;height:14px;margin:6px 2px 0}
.ds-axis span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
.ds-axis span:first-child{transform:none}.ds-axis span:last-child{transform:translateX(-100%)}
.ds-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.ds-leg span{display:inline-flex;align-items:center;gap:6px}
.ds-leg i{width:8px;height:8px;border-radius:4px;background:var(--sc)}
.since{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.since div{padding:10px 12px;border-radius:16px;background:var(--surface-2);box-shadow:var(--hl)}
.since b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.since small{font-size:11px;color:var(--ink-3)}
.dayshape{border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--hl);padding:12px 12px 8px}
.dayshape text{font-family:var(--f-mono);font-size:10px;fill:var(--ink-3)}
.dayshape .lbl{font-family:var(--f-body);font-size:11px;font-weight:600;fill:var(--ink)}
.top3{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.top3 li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.top3 .n{width:28px;height:28px;border-radius:50%;background:color-mix(in oklab,var(--sc) 78%,#000);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.top3 b{display:block;font-weight:600;line-height:1.3}
.top3 small{color:var(--ink-3);font-size:13px}
/* meeting */
.mtg{display:flex;gap:14px;align-items:center}
.mtg .who b{display:block;font-family:var(--f-display);font-size:20px;letter-spacing:-.01em;line-height:1.15}
.ring{margin-left:auto;text-align:center}
.ring .mono{display:block;color:var(--ink-2);margin-top:2px}
.memo{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--hl);font-size:14px;color:var(--ink-2);display:flex;gap:10px}
.memo .mono{display:block;color:var(--ink-3);margin-bottom:2px}
.prep{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:2px}
.prep button{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:44px;padding:10px 4px;border-radius:12px}
.prep .ck{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--line-2);flex:none;display:grid;place-items:center;color:#fff;transition:background var(--d-fast)}
.prep .ck svg{opacity:0;transition:opacity var(--d-fast)}
.prep button[aria-pressed="true"] .ck svg{opacity:1}
.prep button[aria-pressed="true"] .ck{background:var(--sc);box-shadow:none}
.prep button[aria-pressed="true"] span:last-child{color:var(--ink-3);text-decoration:line-through}
/* reply */
.faces{display:flex;justify-content:center;padding:8px 0 4px}
.faces>*{margin-left:-14px;box-shadow:0 0 0 3px var(--surface);border-radius:50%}
.faces>*:first-child{margin-left:0}
.names{text-align:center;font-size:14px;color:var(--ink-2);margin-top:10px}
.reply-rows{margin-top:16px;display:grid;gap:8px}
.reply-rows div{display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 12px;border-radius:16px;background:var(--surface-2)}
.reply-rows b{font-weight:600}
.reply-rows span:last-child{margin-left:auto;color:var(--ink-3);font-size:12px}
/* quotes */
.quotes{display:grid;gap:10px}
.quote{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--hl)}
.quote.best{box-shadow:inset 0 0 0 2px var(--sc);background:color-mix(in oklab,var(--sc) 7%,var(--surface))}
.quote b{font-weight:600}
.quote .price{font-family:var(--f-display);font-weight:650;font-size:18px}
.quote .bar{grid-column:1/-1;height:8px}
.quote small{grid-column:1/-1;font-size:12px;color:var(--ink-3)}
/* monitor */
.ba{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ba .was{font-family:var(--f-display);font-size:24px;color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:2px}
.ba .now{font-family:var(--f-display);font-size:48px;line-height:.9;font-weight:700;letter-spacing:-.03em;color:color-mix(in oklab,var(--sc) 82%,var(--ink))}
.delta{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:var(--r-pill);background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:13px;margin-bottom:4px}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--ink-3)}
.src{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:8px}
.src a{color:var(--accent)}
/* approval */
.act{border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--hl);overflow:hidden}
.act-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px 14px;font-size:14px;min-height:40px}
.act-row+.act-row{border-top:1px solid var(--line)}
.act-row .cap{font-size:10px}
.act-row .v{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.msg{margin:0;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--ink-2);white-space:pre-line;max-height:96px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.irr{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--risk-bg);color:var(--risk);font-size:13px;font-weight:500}
.irr b{font-weight:700}
/* fyi */
.rcpts{display:flex;gap:12px}
.rcpt{flex:1;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--hl);padding:12px}
.rcpt .amt{font-family:var(--f-display);font-weight:650;font-size:20px;margin-top:6px}
.rcpt small{display:block;color:var(--ink-3);font-size:12px}
.filed{margin-top:14px;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}
/* digest */
.dtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dtile{text-align:left;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--hl);overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform var(--d-fast) var(--ease-out)}
.dtile:active{transform:scale(.98)}
.dtile .art{height:52px}
.dtile .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dtile .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dtile .h{font-size:13px;line-height:1.28;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dtile .s{font-size:11px;color:var(--ink-3);display:flex;gap:4px;align-items:center}
/* completion */
.done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px 120px}
.done-wrap h2{font-family:var(--f-display);font-size:32px;line-height:1.05;letter-spacing:-.025em;margin:22px 0 8px}
.done-wrap p{margin:0;color:var(--ink-2);max-width:300px}
.done-stats{display:flex;gap:8px;margin:20px 0 22px;flex-wrap:wrap;justify-content:center}
.done-ring{animation:rise var(--d-slow) var(--ease-out)}
.done-ring circle.arc{transition:stroke-dashoffset 900ms var(--ease-out)}
.tomorrow{margin-top:24px;width:100%;max-width:340px;text-align:left;display:grid;gap:8px}
.tomorrow div{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}

/* desktop today */
.t-desk{display:grid;grid-template-columns:288px minmax(0,1fr) 336px;height:100%}
.t-list{border-right:1px solid var(--line);overflow:auto;padding:28px 16px}
.t-list h2,.t-ctx h2{margin:0 8px 14px;font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.t-row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:16px;min-height:56px}
.t-row:hover{background:var(--sunken)}
.t-row[aria-current="true"]{background:var(--surface);box-shadow:var(--e1),var(--hl)}
.t-row .tt{min-width:0;flex:1}
.t-row b{display:block;font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-row small{font-size:12px;color:var(--ink-3)}
.t-row.is-done b{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.t-center{display:flex;flex-direction:column;min-width:0;padding:28px 40px 24px}
.t-center .deck{margin:22px auto 0;width:100%;max-width:600px;max-height:660px}
.t-center .dc-title{font-size:30px}
.t-ctx{border-left:1px solid var(--line);overflow:auto;padding:28px 20px;display:flex;flex-direction:column;gap:20px;background:var(--surface-2)}
.ctx-card{border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--e1),var(--hl);overflow:hidden}
.ctx-card .cv{height:84px;position:relative}
.ctx-card .bd{padding:14px 16px 16px;display:grid;gap:8px}
.ctx-card .bd b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.kb{display:grid;gap:6px;font-size:13px;color:var(--ink-2)}
.kb div{display:flex;justify-content:space-between;align-items:center}
.agenda{display:grid;gap:0}
.agenda div{display:grid;grid-template-columns:48px 4px 1fr;gap:10px;align-items:center;font-size:13px;min-height:36px}
.agenda .mono{color:var(--ink-3)}
.agenda i{width:4px;height:24px;border-radius:4px;background:var(--sc)}

/* ---------- Triage ---------- */
.tri{display:flex;flex-direction:column;height:100%;position:relative}
.tri-stage{position:relative;flex:1;margin:14px 16px 0;min-height:0}
.tint{position:absolute;inset:-14px -16px -120px;opacity:0;pointer-events:none;transition:opacity var(--d-fast);z-index:2}
.tint.r{background:radial-gradient(120% 70% at 0% 40%,color-mix(in oklab,var(--ok) 34%,transparent),transparent 70%)}
.tint.l{background:radial-gradient(120% 70% at 100% 40%,color-mix(in oklab,var(--ink-3) 30%,transparent),transparent 70%)}
.reveal{position:absolute;top:34%;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;opacity:0;z-index:2;pointer-events:none}
.reveal.r{left:4px;color:var(--ok)} .reveal.l{right:4px;color:var(--ink-2)}
.tc{position:absolute;inset:0 0 22px 0;background:var(--surface);border-radius:var(--r-2xl);box-shadow:var(--e3),var(--hl);display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;cursor:grab;z-index:3;transform-origin:50% 120%}
.tc.dragging{cursor:grabbing}
.tc.b1{transform:translateY(11px) scale(.948);z-index:1;box-shadow:var(--e2);cursor:default}
.tc.b2{transform:translateY(21px) scale(.896);z-index:0;box-shadow:var(--e1);cursor:default}
.tc.b2>*{opacity:0}
.tc.b1>*{opacity:var(--k,0)}
.tc.b1 .stamp{display:none}
.tc.settle{animation:settle var(--d-slow) var(--ease-spring)}
.tc-h{display:flex;gap:14px;align-items:center;padding:20px 20px 0}
.tc-h b{display:block;font-family:var(--f-display);font-size:21px;letter-spacing:-.015em;line-height:1.15}
.tc-h small{font-size:13px;color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-mem{margin:12px 20px 0;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.tc-mem .stag{flex:none}
.tc-sub{margin:14px 20px 0;font-family:var(--f-display);font-size:22px;line-height:1.12;letter-spacing:-.02em;font-weight:650;text-wrap:balance}
.tc-gist{margin:8px 20px 0;color:var(--ink-2);font-size:14px;line-height:1.45}
.phone .tc-quote{font-size:13px;padding:10px 12px;margin-top:12px}.phone .tc-h{padding-top:16px}
.tc-why{margin:0 20px;padding:0 0 18px;font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:flex-start}
.tc-quote{margin:14px 20px 0;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--hl);font-size:14px;line-height:1.5;color:var(--ink-2);display:grid;gap:4px}
.tc-draft{margin:auto 20px 0;padding:14px 0 0;display:grid;gap:4px}
.tc-draft .cap{display:flex;gap:6px;align-items:center}
.tc-dtx{font-family:var(--f-display);font-size:17px;line-height:1.35;letter-spacing:-.01em;color:var(--ink);text-wrap:pretty}
.tc-intents{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 12px}
.tc-intents button{height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--sunken);font-size:13px;font-weight:600}
.tc-intents button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.stamp{position:absolute;top:26px;padding:6px 12px;border:3px solid currentColor;border-radius:12px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;opacity:0;pointer-events:none;background:var(--surface);z-index:4}
.stamp.r{left:18px;color:var(--ok);transform:rotate(-12deg)}
.stamp.l{right:18px;color:var(--ink-2);transform:rotate(12deg)}
.tri-ctrl{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 12px 0;position:relative;z-index:3}
.phone .tri-ctrl{padding-bottom:28px}
.tri{overflow:hidden}
.deck,.tri-stage{isolation:isolate}
.tb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.15}
.tb .c{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--e2),var(--hl);color:var(--ink);transition:transform var(--d-fast) var(--ease-out)}
.tb:active .c{transform:scale(.92)}
.tb.big .c{background:var(--btn);color:var(--btn-ink)}
.tb.undo .c{width:44px;height:44px;margin-top:6px;background:var(--sunken);box-shadow:none}
.tb[disabled]{opacity:.4;cursor:default}
.coach{position:absolute;inset:0 0 22px 0;z-index:20;background:rgba(18,20,24,.9);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;border-radius:var(--r-2xl);animation:fade var(--d-base)}
.coach .hand{animation:nudge 1.6s var(--ease-io) infinite}
@keyframes nudge{0%,100%{transform:translateX(-26px) rotate(-8deg)}50%{transform:translateX(26px) rotate(8deg)}}
.coach h3{font-family:var(--f-display);font-size:24px;margin:16px 0 6px;letter-spacing:-.015em}
.coach p{margin:0 0 18px;max-width:270px;font-size:14px;opacity:.9}
.coach .legend{display:flex;gap:18px;margin-bottom:18px;font-size:13px;font-weight:600}
.coach .btn{background:#fff;color:#1C1B18}
.snz{display:grid;gap:8px}
.snz button{display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 16px;border-radius:16px;background:var(--surface-2);box-shadow:var(--hl);font-weight:600}
.snz button span:last-child{font-weight:500;color:var(--ink-3);font-size:13px}
.tri-desk{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;height:100%}
.tri-desk .tri{padding:28px 40px 28px}
.tri-desk .tri-stage{width:100%;max-width:520px;margin:20px auto 0;flex:none;height:560px}
.tri-desk .tc-draft{margin-top:18px}.tri-desk .tc-why{margin-top:auto;padding-top:8px}
.tri-desk .wr-prop{margin-top:18px}.tri-desk .wr .wr-b{flex:1}
.tri-desk .tri-ctrl{max-width:520px;margin:12px auto 0;width:100%}
.keys{display:grid;gap:10px;font-size:13px;color:var(--ink-2)}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- Drafts ---------- */
.dr-row{display:flex;gap:12px;align-items:center;padding:14px;border-radius:24px;background:var(--surface);box-shadow:var(--e1),var(--hl);width:100%;text-align:left}
.dr-row+.dr-row{margin-top:10px}
.dr-row .tt{flex:1;min-width:0}
.dr-row b{display:block;font-weight:600}
.dr-row .org{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:6px}
.dr-row p{margin:2px 0 0;font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-row[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.dr-to{display:flex;gap:12px;align-items:center}
.dr-to b{display:block;font-family:var(--f-display);font-size:20px;letter-spacing:-.01em}
.orig{margin-top:16px;border-radius:var(--r-md);background:var(--surface-2);box-shadow:var(--hl)}
.orig summary{list-style:none;display:flex;gap:8px;align-items:center;min-height:48px;padding:0 14px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.orig summary::-webkit-details-marker{display:none}
.orig summary .chev{margin-left:auto;transition:transform var(--d-fast)}
.orig[open] summary .chev{transform:rotate(90deg)}
.orig .ob{padding:0 14px 14px;font-size:14px;color:var(--ink-2);line-height:1.55;white-space:pre-line}
.letter{margin-top:14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e2),var(--hl);padding:18px 20px}
.letter .subj{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.letter textarea{width:100%;border:0;background:transparent;resize:none;font-size:17px;line-height:1.6;min-height:210px;outline:none;padding:0}
.voice{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.tones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tones button{height:40px;padding:0 14px;border-radius:var(--r-pill);background:var(--sunken);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tones button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.send{margin-top:18px;width:100%;height:60px;border-radius:var(--r-pill);background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;gap:12px;padding:0 8px 0 8px;font-weight:650;font-size:16px;position:relative;overflow:hidden;box-shadow:var(--e2)}
.send .av{box-shadow:0 0 0 2px var(--btn)}
.send .go{margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--btn-ink) 14%,transparent)}
.send.sending::after{content:"";position:absolute;inset:0;background:color-mix(in oklab,var(--btn-ink) 16%,transparent);transform-origin:0 50%;animation:fill 900ms var(--ease-io) forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.send-note{margin-top:10px;font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;justify-content:center;text-align:center}
.sent-ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 20px;gap:8px}

.dr-desk{display:grid;grid-template-columns:380px minmax(0,1fr);height:100%}

/* ---------- Spaces ---------- */
.grp{margin-top:22px}
.grp-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 12px}

.grp-h .sp{flex:1}
.ftile{display:block;width:100%;text-align:left;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e2),var(--hl);overflow:hidden;transition:transform var(--d-fast) var(--ease-out)}
.ftile:active,.rtile:active{transform:scale(.985)}
.ftile+.ftile{margin-top:12px}
.ftile .cv{height:104px;position:relative}
.ftile .cv .emb{position:absolute;left:16px;bottom:-22px;--z:52px;box-shadow:0 0 0 4px var(--surface),inset 0 -2px 0 rgba(0,0,0,.14)}
.ftile .cv .pill-st{position:absolute;right:12px;top:12px;box-shadow:var(--e1)}
.ftile .bd{padding:30px 16px 16px;display:grid;gap:8px}
.tname{font-family:var(--f-display);font-size:20px;line-height:1.1;letter-spacing:-.015em;font-weight:650}
.tstat{font-size:14px;line-height:1.4;color:var(--ink-2)}
.tmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3);align-items:center}
.tmeta b{color:var(--ink);font-weight:600}
.rtile{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:24px;background:var(--surface);box-shadow:var(--e1),var(--hl);transition:transform var(--d-fast) var(--ease-out)}
.rtile+.rtile{margin-top:8px}
.rtile .thumb{width:64px;height:64px;border-radius:16px;overflow:hidden;position:relative;flex:none;display:grid;place-items:center}
.rtile .thumb svg.cover{position:absolute;inset:0;width:100%;height:100%}
.rtile .thumb .ic{position:relative;color:#fff}
.rtile .tt{flex:1;min-width:0;display:grid;gap:2px}

.rtile .tt small{font-size:11px;color:var(--ink-3)}
.needs-n{min-width:28px;height:28px;border-radius:16px;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 8px;flex:none}
.pilebtn{position:relative;display:block;width:100%;text-align:left;padding-bottom:14px}
.pilebtn .lay{position:absolute;left:14px;right:14px;bottom:0;height:40px;border-radius:24px;background:var(--surface);box-shadow:var(--e1),var(--hl);opacity:.75}
.pilebtn .lay.two{left:28px;right:28px;bottom:-7px;opacity:.45}
.pilebtn .top{position:relative;display:flex;gap:12px;align-items:center;padding:14px;border-radius:24px;background:var(--surface);box-shadow:var(--e1),var(--hl);z-index:1}
.pilebtn .embs{display:flex}
.pilebtn .embs>*{margin-left:-8px;box-shadow:0 0 0 2.5px var(--surface)}
.pilebtn .embs>*:first-child{margin-left:0}
.pilebtn .tt{flex:1;min-width:0}
.pilebtn b{display:block;font-weight:650}
.pilebtn small{font-size:12px;color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg{border-radius:var(--r-lg);padding:16px;box-shadow:inset 0 0 0 1.5px var(--line-2);background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in oklab,var(--ink) 3%,transparent) 10px 11px);display:grid;gap:10px}
.sugg .row{display:flex;gap:12px;align-items:center}
.sugg b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.sugg p{margin:0;font-size:14px;color:var(--ink-2)}
.sugg .acts{display:flex;gap:8px}
.sp-desk{padding:0 36px 48px}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.sp-grid .ftile+.ftile{margin-top:0}
.sp-grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;align-items:start}
.sp-grid2 .rtile+.rtile{margin-top:0}

/* ---------- Space detail ---------- */
.hero{position:relative;color:#fff;background:var(--sd);overflow:hidden;padding:8px 20px 22px}
.hero svg.cover{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero>*{position:relative}
.hero .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.hero-id{display:flex;gap:14px;align-items:center}
.hfacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.hfacts span{height:26px;display:inline-flex;align-items:center;padding:0 10px;border-radius:var(--r-pill);background:rgba(0,0,0,.22);font-size:12px;font-weight:600}
.person{border-radius:var(--r-md);padding:4px 0}
.hero .round{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;backdrop-filter:blur(6px)}
.hero .emb{background:rgba(255,255,255,.96);color:var(--sd);box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.hero h1{margin:2px 0 0;font-family:var(--f-display);font-size:34px;line-height:1;letter-spacing:-.03em;font-weight:700}
.hero .kind{font-size:13px;opacity:.85;font-weight:500}
.hero .st{margin:14px 0 0;font-size:15px;line-height:1.45;max-width:520px}
.hero .asof{font-size:12px;opacity:.8;margin-top:6px;display:flex;gap:6px;align-items:center}
.hms{margin-top:18px;display:flex;gap:4px}
.hms div{flex:1;min-width:0}
.hms i{display:block;height:6px;border-radius:4px;background:rgba(255,255,255,.28)}
.hms div.on i{background:#fff}
.hms div.cur i{position:relative;overflow:hidden}.hms div.cur i::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:#fff;border-radius:inherit}
.hms span{display:block;font-size:10px;font-weight:600;margin-top:6px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--sunken);border-radius:var(--r-pill);padding:4px;gap:2px}
.seg button{flex:1;height:36px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--ink-2);padding:0 14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sec-h h3{margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.mini-stack{display:grid;gap:10px}
.mcard{display:flex;gap:12px;align-items:center;padding:14px;border-radius:24px;background:var(--surface);box-shadow:var(--e1),var(--hl);position:relative}
.mcard .tt{flex:1;min-width:0}
.mcard b{display:block;font-weight:600;line-height:1.3}
.mcard small{font-size:12px;color:var(--ink-3)}
.mcard.stacked{margin-bottom:10px}
.mcard.stacked::after,.mcard.stacked::before{content:"";position:absolute;left:12px;right:12px;bottom:-6px;height:20px;border-radius:0 0 16px 16px;background:var(--surface);box-shadow:var(--e1),var(--hl);z-index:-1}
.mcard.stacked::before{left:24px;right:24px;bottom:-12px;opacity:.6}
.kicon{width:36px;height:36px;border-radius:12px;background:color-mix(in oklab,var(--sc) 14%,var(--surface));color:color-mix(in oklab,var(--sc) 80%,var(--ink));display:grid;place-items:center;flex:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,78%);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.desk .board{grid-auto-columns:1fr;grid-auto-flow:column}
.bcol{scroll-snap-align:start;background:var(--surface-2);border-radius:24px;padding:12px;box-shadow:var(--hl);display:grid;gap:8px;align-content:start}
.bcol h4{margin:2px 4px 4px;font-size:13px;display:flex;justify-content:space-between}
.bcard{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--e1),var(--hl);font-size:14px;display:grid;gap:6px}
.bcard b{font-weight:600;line-height:1.3}
.bmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-3)}
.wait{font-size:12px;color:var(--warn);display:flex;gap:6px;align-items:center}
.tl{position:relative;padding-left:28px;display:grid;gap:4px}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:color-mix(in oklab,var(--sc) 30%,var(--sunken));border-radius:4px}
.tl-i{position:relative;padding:8px 0 12px}
.tl-i::before{content:"";position:absolute;left:-24px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2.5px var(--sc)}
.tl-i.done::before{background:var(--sc)}
.tl-i.now::before{box-shadow:inset 0 0 0 2.5px var(--sc),0 0 0 5px color-mix(in oklab,var(--sc) 22%,transparent)}
.tl-i .mono{color:var(--ink-3)}
.tl-i b{display:block;font-weight:600}
.tl-i small{font-size:13px;color:var(--ink-2)}
.people{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;text-align:center;flex:none}
.person b{font-size:12px;font-weight:600;line-height:1.2}
.person small{font-size:11px;color:var(--ink-3);line-height:1.2}
.mem{display:grid;gap:8px}
.mem button{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--e1),var(--hl);text-align:left;width:100%}
.mem .tt{flex:1;min-width:0}
.mem b{display:block;font-family:var(--f-mono);font-size:13px;font-weight:500}
.mem small{font-size:12px;color:var(--ink-3)}
.chatbar{position:absolute;left:12px;right:12px;bottom:20px;height:56px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--e3),var(--hl);display:flex;align-items:center;gap:10px;padding:0 6px 0 18px;z-index:24}
.chatbar input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.chatbar .go{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.sd-desk .hero{padding:28px 40px 30px}
.sd-desk .hero h1{font-size:46px}
.sd-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;padding:24px 40px 48px}
.sd-body .chatbar{position:static;box-shadow:var(--e1),var(--hl);margin-top:4px}

/* ---------- Capture ---------- */
.cap-scr{display:flex;flex-direction:column;height:100%;padding:0 20px}
.cap-top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px}
.mic-big{width:112px;height:112px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;box-shadow:var(--e3);position:relative}
.mic-big.rec{background:var(--risk);color:#fff}
.mic-big.rec::before,.mic-big.rec::after{content:"";position:absolute;inset:-12px;z-index:-1;pointer-events:none;border-radius:50%;border:2px solid color-mix(in oklab,var(--risk) 40%,transparent);animation:pulse 1.8s var(--ease-out) infinite}
.mic-big.rec::after{animation-delay:.9s}
@keyframes pulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:96px}
.wave i{width:4px;border-radius:4px;background:var(--ink);animation:wv 900ms var(--ease-io) infinite alternate;height:var(--h)}
.wave.paused i{animation-play-state:paused;opacity:.4}
@keyframes wv{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.live-tx{font-size:20px;line-height:1.45;font-family:var(--f-display);letter-spacing:-.01em;color:var(--ink);text-wrap:pretty}
.live-tx span{color:var(--ink-3)}
.timer{font-family:var(--f-mono);font-size:15px;color:var(--ink-2)}
.steps{display:grid;gap:10px;width:100%}
.step{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--e1),var(--hl);font-weight:500}
.step .sp{flex:1}
.step .st-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none}
.step.done .st-ic{background:var(--ok);color:#fff}
.step.run .st-ic{box-shadow:inset 0 0 0 2px var(--line-2);border-top-color:var(--ink)}
.spin{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--ink);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.step.todo{opacity:.55}
.note{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--e2),var(--hl);padding:18px 18px 14px}
.note h3{margin:0 0 4px;font-family:var(--f-display);font-size:22px;letter-spacing:-.015em}
.note .body{font-size:15px;line-height:1.6;color:var(--ink);white-space:pre-line}
.note .body.raw{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);line-height:1.6}
.xcard{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 12px;align-items:start;padding:12px 12px 8px;border-radius:16px;background:var(--surface);box-shadow:var(--e1),var(--hl);animation:rise var(--d-slow) var(--ease-out) both}
.xcard+.xcard{margin-top:8px}
.xcard .tt{flex:1;min-width:0}
.xcard b{display:block;font-weight:600;line-height:1.3;font-size:14px}
.xcard .to{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.xcard .xrow{grid-column:1/-1;display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.xcard .xrow .to{flex:1;min-width:0}
.xcard.undone{opacity:.5}
.xcard.undone b{text-decoration:line-through}
.picker{display:grid;gap:6px}
.picker button{display:flex;gap:12px;align-items:center;height:52px;padding:0 12px;border-radius:16px;font-weight:600;text-align:left}
.picker button:hover,.picker button[aria-pressed="true"]{background:var(--sunken)}

/* ---------- Onboarding ---------- */
.onb{display:flex;flex-direction:column;height:100%;padding:8px 20px 24px}
.onb>*{flex-shrink:0}
.onb h1{font-family:var(--f-display);font-size:34px;line-height:1.02;letter-spacing:-.03em;margin:12px 0 10px;font-weight:700;text-wrap:balance}
.onb .lede{color:var(--ink-2);margin:0;font-size:15px}
.dots{display:flex;gap:6px}
.fan{position:relative;height:150px;margin:12px 0 0}
.fan .fc{position:absolute;left:50%;top:6px;width:156px;border-radius:24px;overflow:hidden;background:var(--surface);box-shadow:var(--e2),var(--hl);transform:translateX(calc(-50% + var(--i)*92px)) rotate(calc(var(--i)*7deg)) translateY(calc(var(--i)*var(--i)*10px));animation:rise var(--d-slow) var(--ease-out) both}
.fan .fc:nth-child(2){z-index:2;animation-delay:60ms}.fan .fc:nth-child(3){animation-delay:120ms}
.fan .cv{height:64px}
.fan .ft{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12px}
.fan .ft b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line-2);transition:width var(--d-base) var(--ease-out),background var(--d-base)}
.dots i.on{width:24px;background:var(--ink)}
.conn{display:flex;gap:14px;align-items:center;padding:14px;border-radius:24px;background:var(--surface);box-shadow:var(--e1),var(--hl);width:100%;text-align:left}
.conn+.conn{margin-top:10px}
.conn .lg{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--surface-2);box-shadow:var(--hl)}
.conn .tt{flex:1;min-width:0}
.conn b{display:block;font-weight:600}
.conn small{font-size:12px;color:var(--ink-3)}
.conn .ok{width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.trust{display:grid;gap:10px;margin-top:20px}
.trust div{display:flex;gap:10px;font-size:13px;color:var(--ink-2);align-items:flex-start}
.learn{display:grid;gap:8px;margin-top:18px}
.lrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--e1),var(--hl);transition:opacity var(--d-base)}
.lrow.todo{opacity:.45}
.lrow .tt{flex:1;min-width:0}
.lrow b{display:block;font-weight:600;font-size:14px}
.lrow small{font-size:12px;color:var(--ink-3)}
.lrow .ct{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.ask{border-radius:24px;padding:16px;background:var(--btn);color:var(--btn-ink);display:grid;gap:12px;animation:rise var(--d-slow) var(--ease-out)}
.ask b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.ask .acts{display:flex;gap:8px}
.ask .acts button{flex:1;height:44px;border-radius:var(--r-pill);background:color-mix(in oklab,var(--btn-ink) 14%,transparent);font-weight:600}
.ask .acts button.y{background:var(--btn-ink);color:var(--btn)}
.conn .lg{color:var(--ink)}
.meter{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:12px}
.meter .bar{flex:1}
.fact{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.fact .k{width:96px;flex:none;font-size:12px;color:var(--ink-3);padding-top:2px}
.fact .v{flex:1;min-width:0;font-weight:500}
.fact input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px}
.fact button.e{color:var(--ink-3);width:36px;height:36px;border-radius:12px;display:grid;place-items:center;margin-top:-8px}
.fact button.e:hover{background:var(--sunken)}
.newsp{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px}
.newsp .nt{width:150px;flex:none;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--e1),var(--hl);text-align:left;transition:opacity var(--d-fast)}
.newsp .nt.off{opacity:.5}
.nt-ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:var(--e1)}
.nt.off .nt-ck{background:rgba(255,255,255,.6)}
.newsp .nt .t{display:block}
.newsp .nt .cv{height:64px;position:relative}
.newsp .nt div.t{padding:10px 12px;font-weight:600;font-size:13px;line-height:1.3}
.onb-desk{display:grid;grid-template-columns:1fr 1fr;height:100%}
.onb-desk .l{padding:56px 64px;overflow:auto}
.onb-desk .l .onb{height:auto;padding:0;max-width:460px}
.onb-desk .r{position:relative;overflow:hidden;display:grid;place-items:center;background:var(--surface-2);border-left:1px solid var(--line)}

/* ---------- Spend ---------- */
.hero-n{font-family:var(--f-display);font-size:60px;line-height:.95;letter-spacing:-.04em;font-weight:700}
.hero-n small{font-size:26px;letter-spacing:-.02em;color:var(--ink-3)}
.est{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--sunken);font-size:12px;font-weight:600;color:var(--ink-2)}
.spend-chart text{font-family:var(--f-mono);font-size:10px;fill:var(--ink-3)}
.srow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.srow .who{min-width:0;display:grid;gap:2px}
.srow .sub{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.srow .sub b{color:var(--ink);font-weight:600}
.srow.warn .sub b{color:var(--warn)}

function rnd(seed){let x=0;for(const ch of seed)x=(x*31+ch.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return (x%10000)/10000;};}

function mix(a,b,t){const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=h(a),B=h(b);return "#"+A.map((v,i)=>Math.round(v*(1-t)+B[i]*t).toString(16).padStart(2,"0")).join("");}

   case"orbit":for(let i=0;i<5;i++)g+=`<ellipse cx="250" cy="120" rx="${60+i*34}" ry="${26+i*16}" fill="none" stroke="#fff" stroke-opacity="${.28-i*.04}" stroke-width="2" transform="rotate(-18 250 120)"/>`;g+=`<circle cx="190" cy="60" r="9" fill="${lite}"/><circle cx="250" cy="120" r="22" fill="#fff" opacity=".22"/>`;break;
   case"steps":for(let i=0;i<7;i++)g+=`<rect x="${40+i*38}" y="${140-i*18}" width="40" height="${20+i*18}" fill="#fff" opacity="${.08+i*.035}"/>`;g+=`<circle cx="${40+6*38+20}" cy="${140-6*18-14}" r="8" fill="${lite}"/>`;break;
   case"grid":for(let x=0;x<11;x++)for(let y=0;y<6;y++){const k=r();g+=`<rect x="${12+x*29}" y="${10+y*26}" width="21" height="18" rx="4" fill="${k>.82?lite:"#fff"}" opacity="${k>.82?.9:.08+k*.1}"/>`;}break;

   case"sun":g+=`<circle cx="236" cy="70" r="46" fill="${lite}" opacity=".9"/>`;for(let i=0;i<5;i++){let d=`M-10 ${104+i*12}`;for(let x=-10;x<W+20;x+=24)d+=` q6 -7 12 0 t12 0`;g+=`<path d="${d}" fill="none" stroke="#fff" stroke-opacity="${.35-i*.05}" stroke-width="2.4"/>`;}break;
   case"tri":for(let i=0;i<14;i++){const x=r()*W,y=r()*H,z=10+r()*22;g+=`<path d="M${x} ${y}l${z} ${z*.6}l-${z} ${z*.6}Z" fill="${i%3?"#fff":lite}" opacity="${i%3?.16:.8}"/>`;}break;

/* spring: response-based, critically damped unless momentum; worklet-free JS version of { duration:400, dampingRatio:1 } */
function spring(el,from,to,v={x:0,y:0},opt={},done){

  const step=n=>{const t=(n-t0)/1000,x=to.x+pos(dx0,(v.x||0),t),y=to.y+pos(dy0,(v.y||0),t);paint(x,y);

function commitSwipe(dir,kind,label){if(S.screen==="weekly")return wrCommit(dir>0?"accept":"keep");triCommit(kind,label);}
function fling(dir,kind,label,vx=0){

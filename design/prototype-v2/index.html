/* ================= base ================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow-x: clip; }

:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: var(--radius-input); }

/* the wordmark: a small deck, three edges deep, and the name in lower case */
.wm { display: inline-flex; align-items: center; gap:var(--space-xs); font-family: var(--font-display); font-weight: 600; letter-spacing: -0.04em; color: var(--color-ink); }

.chrome { height: 44px; display: flex; align-items: center; gap:var(--space-xs); padding-block:0; padding-left:max(var(--space-md), env(safe-area-inset-left, 0px)); padding-right:max(var(--space-md), env(safe-area-inset-right, 0px)); background: var(--color-chrome); color: var(--color-chrome-ink); font-size: var(--text-sm); position: relative; z-index: var(--z-sticky); }

.chrome .sp { flex: 1; }

/* ================= desktop shell ================= */
.desk { display: grid; grid-template-columns: 232px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; height: 100%; background: var(--color-paper); }
.side { grid-row: 1 / -1; border-right: 1px solid var(--color-rule); display: flex; flex-direction: column; padding:20px var(--space-sm) var(--space-md); gap:var(--space-3xs); overflow: auto; background: var(--color-paper); }

.main { overflow: auto; position: relative; min-width: 0; }
.dhead h1 { font-size: 2.5rem; }
.sp-desk { padding:0 var(--space-xl) var(--space-2xl); max-width: 1180px; }

/* ================= the undo row: in the flow, where the action happened ================= */
.undo-row { display: flex; align-items: center; gap:var(--space-sm); min-width: 0; animation: undoIn var(--dur-short) var(--ease-out); }

@keyframes undoIn { from { opacity: 0; transform: translateY(4px); } }

/* ================= atoms ================= */
.btn { height: 40px; padding:0 var(--space-md); border-radius: var(--radius-card); display: inline-flex; align-items: center; justify-content: center; gap:var(--space-xs); font-weight: 500; font-size: var(--text-sm); white-space: nowrap; border: 1px solid transparent; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); position: relative; }

.btn.sec:hover { background: var(--color-paper-2); }

.tbtn .num { color: var(--color-signal); font-weight: 600; }

/* status is text */
.chip { display: inline-flex; align-items: center; gap:var(--space-2xs); font-size: var(--text-xs); font-weight: 500; color: var(--color-ink-2); white-space: nowrap; }
.chip.sm { font-size: var(--text-xs); }
.chip.paused { color: var(--color-muted); }
button.chip { min-height: 32px; position: relative; color: var(--color-ink); border-radius: var(--radius-input); }
button.chip:hover { text-decoration: underline; text-underline-offset: 0.2em; }
button.chip:active { transform: translateY(1px); }
.st-t { font-size: var(--text-xs); font-weight: 500; color: var(--color-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.st-t.needs, .st-t.stalled { color: var(--color-signal); }
.lg-k { font-size: var(--text-xs); font-weight: 500; white-space: nowrap; flex: none; color: var(--color-muted); }
.lg-k.rev { color: var(--color-ink-2); }
.lg-k.irr { color: var(--color-signal); }
.rv { display: inline-flex; gap:var(--space-2xs); align-items: center; font-size: var(--text-xs); color: var(--color-ink-2); }
.ver { color: var(--color-ink-2); display: inline-flex; }

/* Space glyph: a small square, the line icon carries a trace of the Space's hue */
.emb { --z: 28px; width: var(--z); height: var(--z); border-radius: var(--radius-input); background: var(--color-paper-2); box-shadow: inset 0 0 0 1px var(--color-rule); color: color-mix(in oklab, var(--hue) 62%, var(--color-ink)); display: grid; place-items: center; flex: none; }
.stag { display: inline-flex; align-items: center; gap:var(--space-xs); font-size: var(--text-sm); font-weight: 500; color: var(--color-ink); min-width: 0; }
.stag > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent { display: inline-flex; align-items: center; gap:var(--space-2xs); font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.agent .am, .am { display: inline-grid; place-items: center; color: var(--color-ink-2); }
.am.lg { width: 32px; height: 32px; border-radius: var(--radius-input); background: var(--color-paper-2); color: var(--color-ink); flex: none; }
.av { border-radius: 50%; flex: none; overflow: hidden; display: block; }
.av.ini, .av.org { display: grid; place-items: center; background: var(--color-paper-3); color: var(--color-ink-2); font-weight: 600; }
.brand-mark { display: grid; place-items: center; background: var(--color-ink); color: var(--color-paper); font-weight: 600; flex: none; }
.pile { display: flex; }
.pile > * { margin-left:calc(-1 * var(--space-xs)); box-shadow: 0 0 0 2px var(--color-cotton); border-radius: 50%; }
.pile > *:first-child { margin-left:0; }
.bar { height: 4px; border-radius: var(--space-3xs); background: var(--color-paper-3); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--color-ink); }
.ms { display: flex; gap:var(--space-2xs); }
.ms i { flex: 1; height: 4px; border-radius: var(--space-3xs); background: var(--color-paper-3); }
.ms i.on { background: var(--color-ink); }
.src { display: flex; gap:var(--space-xs); align-items: center; font-size: var(--text-xs); color: var(--color-muted); margin-top:var(--space-xs); }
.kicon { width: 32px; height: 32px; border-radius: var(--radius-input); background: var(--color-paper-2); color: var(--color-ink-2); display: grid; place-items: center; flex: none; }
.hr { height: 1px; background: var(--color-rule); border: 0; margin:0; }
.panel { border-radius: var(--radius-card); border: 1px solid var(--color-rule); padding:20px; }
.ctx-card { border-top: 1px solid var(--color-rule); padding-top:var(--space-md); }
.ctx-card .cv { display: none; }
.ctx-card .bd { display: grid; gap:var(--space-xs); }
.ctx-card .bd b { font-size: var(--text-md); font-weight: 600; }
.empty-c { display: grid; justify-items: start; gap:var(--space-xs); padding:var(--space-xl) var(--space-2xs); color: var(--color-ink-2); }
.empty-c svg { color: var(--color-muted); }
.empty-c b { font-size: var(--text-lg); font-weight: 600; color: var(--color-ink); }
.empty-c span { max-width: 44ch; font-size: var(--text-sm); }
input.sw { appearance: none; width: 44px; height: 28px; border-radius: var(--radius-pill); background: var(--color-rule-2); position: relative; cursor: pointer; flex: none; margin:0; transition: background-color var(--dur-micro) var(--ease-out); }
input.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--color-cotton); box-shadow: var(--edge-stock); transition: transform var(--dur-short) var(--ease-out); }
input.sw:checked { background: var(--color-signal); }
input.sw:checked::after { transform: translateX(16px); }
input.sw:disabled { background: var(--color-paper-3); cursor: not-allowed; }

/* text options: a choice of a few, chosen one in the signal and underlined */
.fchips, .tones, .tc-intents, .wr-opts { display: flex; gap:var(--space-2xs) var(--space-md); flex-wrap: wrap; }
.fchips button, .tones button, .tc-intents button, .wr-opts button { height: 32px; padding:0; display: inline-flex; align-items: center; gap:var(--space-2xs); font-size: var(--text-sm); font-weight: 500; color: var(--color-ink-2); white-space: nowrap; position: relative; text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: 2px; text-underline-offset: 0.45em; transition: color var(--dur-micro) var(--ease-out), text-decoration-color var(--dur-micro) var(--ease-out); }
.fchips button::after, .tones button::after, .tc-intents button::after, .wr-opts button::after { content: ""; position: absolute; inset: -6px -6px; }
.fchips button:hover, .tones button:hover, .tc-intents button:hover, .wr-opts button:hover { color: var(--color-ink); text-decoration-color: var(--color-rule-2); }
.fchips button[aria-pressed="true"], .tones button[aria-pressed="true"], .tc-intents button[aria-pressed="true"], .wr-opts button[aria-pressed="true"] { color: var(--color-signal); text-decoration-color: var(--color-signal); }
.fchips button:active, .tones button:active, .tc-intents button:active, .wr-opts button:active { transform: translateY(1px); }

/* segmented: a groove pressed into the paper, a cotton card riding in it */
.seg { display: flex; background: var(--color-paper-2); border-radius: var(--radius-card); padding:var(--space-3xs); gap:var(--space-3xs); box-shadow: var(--press-groove); }
.seg button { flex: 1; height: 32px; border-radius: var(--radius-input); font-size: var(--text-sm); font-weight: 500; color: var(--color-ink-2); padding:0 var(--space-sm); position: relative; transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out); }
.seg button::after { content: ""; position: absolute; inset: -4px 0; }
.seg button:hover { color: var(--color-ink); }
.seg button[aria-pressed="true"] { background: var(--color-cotton); color: var(--color-ink); box-shadow: var(--edge-stock); }

/* headers */
.ph-head { padding:var(--space-xs) 20px var(--space-sm); display: flex; align-items: flex-end; gap:var(--space-sm); flex-wrap: wrap; }
.ph-head h1 { font-size: var(--text-3xl); line-height: 1.02; }
.ph-head .meta { margin-top:var(--space-2xs); }
.ph-head .sp { flex: 1; }
.main .ph-head { padding:32px var(--space-xl) var(--space-md); max-width: 1180px; }
.main .ph-head h1 { font-size: 2.5rem; }
.round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--color-ink); position: relative; transition: background-color var(--dur-micro) var(--ease-out); }
.round::after { content: ""; position: absolute; inset: -2px; }
.round:hover { background: var(--color-paper-2); }
.round:active { transform: translateY(1px); }
.round[aria-pressed="true"] { color: var(--color-signal); }
.hd-ctl { display: flex; gap:var(--space-md); align-items: center; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap:var(--space-sm); margin:32px 0 var(--space-xs); }
.sec-h h2, .sec-h h3 { font-size: var(--text-lg); letter-spacing: -0.02em; }

/* ================= Today: the deck ================= */
.today { display: flex; flex-direction: column; height: 100%; }
.deck { --n: 2; position: relative; flex: 1; margin:var(--space-sm) var(--space-md) var(--space-md); min-height: 0; isolation: isolate; }
.dc { position: absolute; inset: 0 0 calc(var(--n) * 5px + 4px) 0; background: var(--color-cotton); color: var(--color-ink); border-radius: var(--radius-stock); box-shadow: var(--edge-stock), var(--cast-stock); display: flex; flex-direction: column; overflow: hidden; transform-origin: 50% 100%; will-change: transform; }
.dc.b1 { transform: translateY(5px) scale(.988); z-index: -1; }
.dc.b2 { transform: translateY(10px) scale(.976); z-index: -2; }
.edges { position: absolute; inset: 0 0 calc(var(--n) * 5px + 4px) 0; z-index: -3; pointer-events: none; }
.edges i { position: absolute; inset: 0; border-radius: var(--radius-stock); background: var(--color-cotton); box-shadow: var(--edge-stock), var(--cast-stock); transform: translateY(calc(var(--k) * 5px)) scale(calc(1 - var(--k) * 0.012)); transform-origin: 50% 100%; }
.dc.settle { animation: settle var(--dur-long) var(--ease-out); }
.dc.b1.promote, .tc.b1.promote { transform: none !important; transition: transform 280ms var(--ease-out); --k: 1; z-index: 2; }
.dc.leaving > * { opacity: 0; transition: opacity 90ms linear; }
@keyframes settle { 0% { transform: translateY(10px) scale(.976); } 100% { transform: none; } }

.dc-head { padding:20px 20px 0; display: grid; gap:var(--space-xs); }
.dc-title { font-size: var(--text-2xl); line-height: 1.1; letter-spacing: -0.03em; }
.dc-meta { display: flex; align-items: center; gap:var(--space-xs); font-size: var(--text-sm); color: var(--color-muted); min-width: 0; }
.dc-meta > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dc-meta b { font-weight: 500; color: var(--color-ink-2); }
.dc-body { flex: 1; overflow: auto; padding:var(--space-md) 20px var(--space-sm); scrollbar-width: thin; display: flex; flex-direction: column; }
.dc-in { flex: 1 0 auto; }
.prov { display: flex; gap:var(--space-xs); align-items: center; margin-top:var(--space-md); padding-top:var(--space-sm); border-top: 1px solid var(--color-rule); font-size: var(--text-xs); color: var(--color-muted); }
.prov span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prov button { height: 32px; font-weight: 500; color: var(--color-ink); text-decoration: underline; text-decoration-color: var(--color-rule-2); text-underline-offset: 0.2em; position: relative; }
.prov button::after { content: ""; position: absolute; inset: -8px -4px; }
.prov button:hover { text-decoration-color: var(--color-ink); }
.dc-foot { display: flex; gap:var(--space-xs); padding:var(--space-sm) var(--space-md) var(--space-md); align-items: center; position: relative; }
.dc-foot .btn.pri { flex: 1; }
.more-menu { position: absolute; right: var(--space-sm); bottom: 64px; background: var(--color-cotton); border-radius: var(--radius-card); box-shadow: var(--edge-stock), var(--cast-stock-lift); padding:var(--space-2xs); min-width: 220px; z-index: 5; animation: rise var(--dur-short) var(--ease-out); }
.more-menu button { display: flex; width: 100%; height: 40px; align-items: center; padding:0 var(--space-sm); border-radius: var(--radius-input); font-size: var(--text-sm); text-align: left; }
.more-menu button:hover { background: var(--color-paper-2); }

.cv { display: none; }

/* brief */
.dayshape { padding:var(--space-2xs) 0 0; }
.ds-track { position: relative; height: 40px; margin:20px 0 0; border-bottom: 1px solid var(--color-rule); }
.ds-track .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--color-rule); }
.ds-free { position: absolute; top: 8px; bottom: 8px; border-radius: var(--space-2xs); background: var(--color-paper-2); box-shadow: inset 0 0 0 1px var(--color-rule-2); display: flex; align-items: center; justify-content: center; font-size: var(--text-xs); font-weight: 500; color: var(--color-ink-2); white-space: nowrap; }
.ds-ev { position: absolute; top: 8px; bottom: 8px; border-radius: var(--space-2xs); min-width: 8px; background: var(--color-ink-2); opacity: .55; }
.ds-now { position: absolute; top: -16px; bottom: 0; width: 2px; margin-left:-1px; background: var(--color-signal); }
.ds-now span { position: absolute; top: -4px; left: 8px; font-family: var(--font-outlier); font-size: var(--text-2xs); white-space: nowrap; color: var(--color-signal); }
.ds-axis { position: relative; height: 16px; margin:var(--space-2xs) 0 0; }
.ds-axis span { position: absolute; transform: translateX(-50%); font-family: var(--font-outlier); font-size: var(--text-2xs); color: var(--color-muted); }
.ds-axis span:first-child { transform: none; } .ds-axis span:last-child { transform: translateX(-100%); }
.ds-leg { display: flex; flex-wrap: wrap; gap:var(--space-2xs) var(--space-md); margin-top:var(--space-xs); font-size: var(--text-xs); color: var(--color-ink-2); }
.ds-leg i { display: none; }
.top3 { list-style: none; margin:var(--space-md) 0 0; padding:0; display: grid; }
.top3 li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap:var(--space-sm); align-items: baseline; padding:var(--space-xs) 0; border-top: 1px solid var(--color-rule); }
.top3 .n { font-family: var(--font-outlier); font-size: var(--text-sm); color: var(--color-muted); }
.top3 b { display: block; font-weight: 500; line-height: 1.3; }
.top3 small { color: var(--color-muted); font-size: var(--text-sm); }
.since { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:var(--space-sm); margin-top:var(--space-md); padding-top:var(--space-sm); border-top: 1px solid var(--color-rule); }
.since b { display: block; font-family: var(--font-outlier); font-weight: 400; font-size: var(--text-xl); letter-spacing: -0.02em; }
.since small { font-size: var(--text-xs); color: var(--color-muted); }
/* meeting */
.mtg { display: flex; gap:var(--space-sm); align-items: center; }
.mtg .who b { display: block; font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.ring { margin-left:auto; text-align: center; }
.ring .mono { display: block; color: var(--color-muted); margin-top:var(--space-3xs); }
.memo { margin-top:var(--space-md); font-size: var(--text-sm); color: var(--color-ink-2); display: flex; gap:var(--space-sm); padding-top:var(--space-sm); border-top: 1px solid var(--color-rule); }
.memo svg { color: var(--color-muted); }
.memo .mono { display: block; color: var(--color-muted); margin-bottom:var(--space-3xs); }
.prep { list-style: none; padding:0; margin:var(--space-sm) 0 0; display: grid; }
.prep button { display: flex; gap:var(--space-sm); align-items: flex-start; text-align: left; width: 100%; min-height: 44px; padding:var(--space-xs) 0; border-radius: var(--radius-input); font-size: var(--text-sm); }
.prep .ck { width: 20px; height: 20px; border-radius: var(--radius-input); box-shadow: inset 0 0 0 1.5px var(--color-rule-2); flex: none; display: grid; place-items: center; color: var(--color-signal-ink); transition: background-color var(--dur-micro) var(--ease-out); }
.prep .ck svg { opacity: 0; transition: opacity var(--dur-micro) var(--ease-out); }
.prep button[aria-pressed="true"] .ck { background: var(--color-signal); box-shadow: none; }
.prep button[aria-pressed="true"] .ck svg { opacity: 1; }
.prep button[aria-pressed="true"] span:last-child { color: var(--color-muted); text-decoration: line-through; }
/* reply */
.faces { display: flex; padding:var(--space-xs) 0 0; }
.faces > * { margin-left:calc(-1 * var(--space-xs)); box-shadow: 0 0 0 3px var(--color-cotton); border-radius: 50%; }
.faces > *:first-child { margin-left:0; }
.names { font-size: var(--text-sm); color: var(--color-ink-2); margin-top:var(--space-xs); }
.reply-rows { margin-top:var(--space-md); display: grid; }
.reply-rows div { display: flex; gap:var(--space-sm); align-items: center; font-size: var(--text-sm); padding:var(--space-xs) 0; border-top: 1px solid var(--color-rule); min-width: 0; }
.reply-rows div > span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reply-rows b { font-weight: 600; }
.reply-rows span:last-child { margin-left:auto; color: var(--color-muted); font-size: var(--text-xs); font-family: var(--font-outlier); }
/* quotes: rows, the recommended one marked in the signal */
.quotes { display: grid; }
.quote { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap:var(--space-2xs) var(--space-sm); padding:var(--space-sm) 0; border-top: 1px solid var(--color-rule); }
.quote:first-child { border-top: 0; padding-top:0; }
.quote b { font-weight: 500; }
.quote.best b, .quote.best .price { color: var(--color-signal); }
.quote .price { font-family: var(--font-outlier); font-size: var(--text-lg); }
.quote .bar { grid-column: 1 / -1; }
.quote .bar i { background: var(--color-muted) !important; }
.quote.best .bar i { background: var(--color-signal) !important; }
.quote small { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--color-muted); }
/* monitor */
.ba { display: flex; align-items: baseline; gap:var(--space-sm); flex-wrap: wrap; }
.ba .was { font-family: var(--font-outlier); font-size: var(--text-lg); color: var(--color-muted); text-decoration: line-through; }
.ba .now { font-family: var(--font-outlier); font-size: var(--text-4xl); line-height: .95; letter-spacing: -0.04em; color: var(--color-ink); }
.delta { display: inline-flex; align-items: center; gap:var(--space-2xs); font-family: var(--font-outlier); font-size: var(--text-sm); color: var(--color-signal); }
.delta svg { display: none; }
.chart text { font-family: var(--font-outlier); font-size: var(--text-2xs); fill: var(--color-muted); }
/* approval */
.act { border-top: 1px solid var(--color-rule); border-bottom: 1px solid var(--color-rule); }
.act-row { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap:var(--space-sm); align-items: center; padding:var(--space-xs) 0; font-size: var(--text-sm); min-height: 40px; }
.act-row + .act-row { border-top: 1px solid var(--color-rule); }
.act-row .v { display: flex; align-items: center; gap:var(--space-xs); min-width: 0; font-weight: 500; }
.msg { margin:0; padding:var(--space-sm) 0; border-top: 1px solid var(--color-rule); font-size: var(--text-sm); line-height: 1.55; color: var(--color-ink-2); white-space: pre-line; max-height: 96px; overflow: hidden; }
.irr { margin-top:var(--space-sm); display: flex; gap:var(--space-xs); align-items: flex-start; color: var(--color-ink-2); font-size: var(--text-sm); }
.irr svg { color: var(--color-signal); }
.irr b { font-weight: 600; color: var(--color-signal); }
/* fyi */
.rcpts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:var(--space-md); }
.rcpt svg { color: var(--color-muted); }
.rcpt .amt { font-family: var(--font-outlier); font-size: var(--text-xl); margin-top:var(--space-2xs); }
.rcpt small { display: block; color: var(--color-muted); font-size: var(--text-xs); }
.filed { margin-top:var(--space-md); display: flex; gap:var(--space-xs); align-items: center; font-size: var(--text-sm); color: var(--color-ink-2); flex-wrap: wrap; }
/* digest: a short list of stories, each to its source */
.dtiles { display: grid; }
.dtile { text-align: left; display: block; padding:var(--space-sm) 0; border-top: 1px solid var(--color-rule); min-width: 0; border-radius: 0; }
.dtile:first-child { border-top: 0; padding-top:0; }
.dtile:hover .h { text-decoration: underline; text-decoration-color: var(--color-rule-2); text-underline-offset: 0.2em; }
.dtile .tx { display: grid; gap:var(--space-3xs); min-width: 0; }
.dtile .k { font-size: var(--text-xs); color: var(--color-muted); }
.dtile .h { font-size: var(--text-sm); line-height: 1.35; font-weight: 500; }
.dtile .s { font-size: var(--text-xs); color: var(--color-muted); display: flex; gap:var(--space-2xs); align-items: center; }
/* the end of the deck */
.done-wrap { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding:0 28px var(--space-xl); max-width: 520px; margin:0 auto; width: 100%; }
.done-wrap h2 { font-size: var(--text-3xl); line-height: 1.02; margin:20px 0 var(--space-xs); }
.done-wrap p { color: var(--color-ink-2); max-width: 36ch; }
.done-stats { display: grid; gap:var(--space-2xs); margin:var(--space-md) 0 20px; font-size: var(--text-sm); color: var(--color-ink-2); }
.done-stats .chip { font-size: var(--text-sm); }
.done-ring { color: var(--color-ink); }
.tomorrow { margin-top:28px; width: 100%; display: grid; border-top: 1px solid var(--color-rule); }
.tomorrow .cap { padding-top:var(--space-sm); }
.tomorrow div { display: flex; gap:var(--space-sm); align-items: center; font-size: var(--text-sm); color: var(--color-ink-2); padding:var(--space-xs) 0; }

/* desktop Today */
.t-desk { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; height: 100%; }
.t-list { border-right: 1px solid var(--color-rule); overflow: auto; padding:32px var(--space-md); }
.t-list h2, .t-ctx h2, .side-t { margin:0 var(--space-xs) var(--space-sm); font-size: var(--text-md); letter-spacing: -0.01em; }
.t-ctx .side-t { margin-left:0; }
.t-row { display: flex; gap:var(--space-sm); align-items: center; width: 100%; text-align: left; padding:var(--space-xs); border-radius: var(--radius-card); min-height: 52px; transition: background-color var(--dur-micro) var(--ease-out); }
.t-row:hover:not([disabled]) { background: var(--color-paper-2); }
.t-row[aria-current="true"] { background: var(--color-paper-2); }

.kb { display: grid; gap:var(--space-xs); font-size: var(--text-sm); color: var(--color-ink-2); }

.agenda { display: grid; }
.agenda div { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap:var(--space-sm); align-items: center; font-size: var(--text-sm); min-height: 36px; border-top: 1px solid var(--color-rule); }

.ppl { display: grid; gap:var(--space-sm); }

/* ================= Triage and weekly review ================= */
.tri { display: flex; flex-direction: column; height: 100%; position: relative; overflow: hidden; }
.tri-stage { --n: 2; position: relative; flex: 1; margin:var(--space-sm) var(--space-md) 0; min-height: 0; isolation: isolate; }
.tint { position: absolute; inset: -12px -16px -96px; opacity: 0; pointer-events: none; transition: opacity var(--dur-micro) var(--ease-out); z-index: 2; }

.tint.l { background: linear-gradient(270deg, color-mix(in oklab, var(--color-ink) 8%, transparent), transparent 60%); }
.reveal { position: absolute; top: 36%; display: flex; flex-direction: column; align-items: center; gap:var(--space-xs); font-weight: 600; font-size: var(--text-lg); z-index: 2; pointer-events: none; }
.js .reveal, .js .stamp { opacity: 0; }
.reveal.r { left: var(--space-2xs); color: var(--color-signal); } .reveal.l { right: var(--space-2xs); color: var(--color-ink-2); }
.tc { position: absolute; inset: 0 0 calc(var(--n) * 5px + 4px) 0; background: var(--color-cotton); color: var(--color-ink); border-radius: var(--radius-stock); box-shadow: var(--edge-stock), var(--cast-stock); display: flex; flex-direction: column; overflow: hidden; touch-action: none; user-select: none; cursor: grab; z-index: 3; transform-origin: 50% 120%; }
.tc.dragging { cursor: grabbing; box-shadow: var(--edge-stock), var(--cast-stock-lift); }
.tc.b1 { transform: translateY(5px) scale(.988); z-index: 1; cursor: default; }
.tc.b2 { transform: translateY(10px) scale(.976); z-index: 0; cursor: default; }
.js .tc.b1 > * { opacity: var(--k, 0); }
.tc.b1 .stamp { display: none; }
.tc.b1.promote > * { opacity: 1; }
.tri-stage .edges { z-index: -1; }
.tc.settle { animation: settle var(--dur-long) var(--ease-out); }
.tc-h { display: flex; gap:var(--space-sm); align-items: center; padding:20px 20px 0; }
.tc-h b { display: block; font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.tc-h small { font-size: var(--text-sm); color: var(--color-muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-mem { margin:var(--space-sm) 20px 0; font-size: var(--text-sm); color: var(--color-ink-2); display: flex; gap:var(--space-xs); align-items: center; min-width: 0; }
.tc-mem .stag { flex: none; }
.tc-sub { margin:var(--space-md) 20px 0; font-size: var(--text-xl); line-height: 1.15; letter-spacing: -0.025em; }
.tc-gist { margin:var(--space-xs) 20px 0; color: var(--color-ink-2); font-size: var(--text-sm); line-height: 1.5; }
.tc-quote { margin:var(--space-md) 20px 0; padding:0 0 0 var(--space-sm); border-left: 2px solid var(--color-rule-2); font-size: var(--text-sm); line-height: 1.5; color: var(--color-ink-2); display: grid; gap:var(--space-2xs); }
.tc-draft { margin:auto 20px 0; padding:var(--space-md) 0 0; display: grid; gap:var(--space-2xs); }
.tc-draft .cap { display: flex; gap:var(--space-2xs); align-items: center; }
.tc-dtx { font-size: var(--text-md); line-height: 1.4; color: var(--color-ink); text-wrap: pretty; }
.tc-intents { padding:var(--space-xs) 20px var(--space-sm); }
.tc-why { margin:0 20px; padding:0 0 var(--space-md); font-size: var(--text-xs); color: var(--color-muted); display: flex; gap:var(--space-xs); align-items: flex-start; }
.hint { margin:var(--space-sm) 20px 0; font-size: var(--text-sm); color: var(--color-ink-2); display: flex; gap:var(--space-xs); align-items: baseline; flex-wrap: wrap; }
.hint button { white-space: nowrap; min-height: 32px; display: inline-flex; align-items: center; font-weight: 600; color: var(--color-signal); text-decoration: underline; text-underline-offset: 0.2em; position: relative; }
.hint button::after { content: ""; position: absolute; inset: -12px -8px; }
.stamp { position: absolute; top: 24px; padding:var(--space-2xs) var(--space-sm); border: 2px solid currentColor; border-radius: var(--radius-input); font-weight: 600; font-size: var(--text-lg); pointer-events: none; background: var(--color-cotton); z-index: 4; }
.stamp.r { left: var(--space-md); color: var(--color-signal); transform: rotate(-8deg); }
.stamp.l { right: var(--space-md); color: var(--color-ink-2); transform: rotate(8deg); }
.tri-ctrl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap:var(--space-2xs); padding:var(--space-sm) var(--space-sm) 0; position: relative; z-index: 3; }
.phone .tri-ctrl { padding-bottom:28px; }
.tb { display: flex; flex-direction: column; align-items: center; gap:var(--space-xs); font-size: var(--text-xs); font-weight: 500; color: var(--color-ink-2); text-align: center; line-height: 1.2; }
.tb .c { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--color-ink); border: 1px solid var(--color-rule-2); transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.tb:hover .c { background: var(--color-paper-2); }
.tb:active .c { transform: scale(.94); }

.tb[disabled] { color: var(--color-muted); cursor: not-allowed; }
.tb[disabled] .c { background: var(--color-paper-2); color: var(--color-muted); border-color: var(--color-rule); transform: none; }
.tb.big[disabled] .c { background: var(--color-paper-2); }
.snz { display: grid; }
.snz button { display: flex; justify-content: space-between; align-items: center; height: 52px; padding:0 var(--space-2xs); border-top: 1px solid var(--color-rule); font-weight: 500; }
.snz button:hover { color: var(--color-signal); }
.snz button span:last-child { font-weight: 400; color: var(--color-muted); font-size: var(--text-sm); }
.tri-desk { display: grid; grid-template-columns: 280px minmax(0, 1fr) 300px; height: 100%; }
.tri-desk .tri { padding:32px var(--space-xl); }
.tri-desk .ph-head { max-width: 520px; width: 100%; margin:0 auto; padding:0; }

.tri-desk .tc-draft { margin-top:20px; } .tri-desk .tc-why { margin-top:auto; padding-top:var(--space-xs); }
.tri-desk .wr-prop { margin-top:20px; } .tri-desk .wr .wr-b { flex: 1; }
.tri-desk .tri-ctrl { max-width: 520px; margin:var(--space-sm) auto 0; width: 100%; }
.keys { display: grid; gap:var(--space-sm); font-size: var(--text-sm); color: var(--color-ink-2); }
.keys div { display: flex; justify-content: space-between; align-items: center; gap:var(--space-xs); }

/* weekly card */
.tc.wr { cursor: grab; }
.wr-cv { flex: none; padding:20px 20px 0; }
.wr-cvin { display: flex; gap:var(--space-sm); align-items: center; color: var(--color-ink); }
.wr-cvin > span:not(.emb):not(.st-t) { flex: 1; min-width: 0; display: grid; }

.wr-ms { display: flex; gap:var(--space-sm); align-items: center; padding:var(--space-md) 20px 0; }

.wr-b { padding:var(--space-md) 20px 0; display: grid; gap:var(--space-md); align-content: start; }
.wr-col { display: grid; gap:var(--space-2xs); }
.wr-i { display: flex; gap:var(--space-xs); align-items: flex-start; font-size: var(--text-sm); line-height: 1.4; }
.wr-i svg { margin-top:var(--space-3xs); color: var(--color-muted); }
.wr-i.st svg { color: var(--color-signal); }
.wr-pace { font-size: var(--text-sm); color: var(--color-ink-2); }
.wr-prop { margin:var(--space-md) 20px var(--space-md); padding-top:var(--space-sm); border-top: 1px solid var(--color-rule); display: grid; gap:var(--space-xs); }
.wr-pt { display: flex; gap:var(--space-sm); align-items: center; }
.wr-pt b { font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.wr-pt .kicon { width: 28px; height: 28px; }
.wr-prop small { font-size: var(--text-sm); color: var(--color-ink-2); line-height: 1.45; }
.wr-ctrl { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.wr-sum { display: grid; width: 100%; margin:var(--space-md) 0 20px; }
.wr-sum div { display: flex; gap:var(--space-sm); align-items: center; font-size: var(--text-sm); padding:var(--space-xs) 0; border-top: 1px solid var(--color-rule); }
.wr-sum div span:nth-child(2) { flex: 1; }

/* ================= Drafts ================= */
.dr-row { display: flex; gap:var(--space-sm); align-items: center; padding:var(--space-sm) var(--space-xs); width: 100%; text-align: left; border-top: 1px solid var(--color-rule); border-radius: 0; transition: background-color var(--dur-micro) var(--ease-out); }
.dr-row:hover { background: var(--color-paper-2); }
.dr-row .tt { flex: 1; min-width: 0; }
.dr-row b { display: block; font-weight: 500; }
.dr-row p { margin:var(--space-3xs) 0 0; font-size: var(--text-sm); color: var(--color-ink-2); }
.dr-row .org { display: flex; gap:var(--space-xs); align-items: center; font-size: var(--text-xs); color: var(--color-muted); margin-top:var(--space-2xs); }
.dr-row > svg { color: var(--color-muted); }

.dr-row[aria-current="true"] b { color: var(--color-signal); }
.dr-to { display: flex; gap:var(--space-sm); align-items: center; }
.dr-to b { display: block; font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.02em; }
.dr-to span { display: block; }
.orig { margin-top:var(--space-md); border-top: 1px solid var(--color-rule); border-bottom: 1px solid var(--color-rule); }
.orig summary { list-style: none; display: flex; gap:var(--space-xs); align-items: center; min-height: 44px; cursor: pointer; font-size: var(--text-sm); color: var(--color-ink-2); }
.orig summary::-webkit-details-marker { display: none; }
.orig summary > svg:last-child { margin-left:auto; transition: transform var(--dur-micro) var(--ease-out); }
.orig[open] summary > svg:last-child { transform: rotate(90deg); }
.orig .ob { padding:0 0 var(--space-md); font-size: var(--text-sm); color: var(--color-ink-2); line-height: 1.55; white-space: pre-line; }
.letter { margin-top:var(--space-md); }
.letter .subj { font-size: var(--text-sm); color: var(--color-muted); margin-bottom:var(--space-sm); }
.letter textarea { width: 100%; border: 1px solid var(--color-muted); border-radius: var(--radius-card); background: var(--color-cotton); resize: none; font-size: var(--text-md); line-height: 1.6; min-height: 240px; padding:var(--space-md); color: var(--color-ink); display: block; }
.letter textarea:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 1px; }
.voice { display: flex; gap:var(--space-xs); align-items: center; font-size: var(--text-xs); color: var(--color-muted); margin-top:var(--space-xs); padding-top:var(--space-sm); border-top: 1px solid var(--color-rule); }
.tones { margin-top:var(--space-md); }
.send { margin-top:20px; width: 100%; height: 56px; border-radius: var(--radius-card); background: var(--color-signal); color: var(--color-signal-ink); display: flex; align-items: center; gap:var(--space-sm); padding:0 var(--space-xs); font-weight: 600; font-size: var(--text-md); position: relative; overflow: hidden; transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
.send:hover { background: var(--color-signal-hover); }
.send:active { transform: translateY(1px); }
.send .av { box-shadow: 0 0 0 2px var(--color-signal); }
.send .go { margin-left:auto; width: 40px; height: 40px; display: grid; place-items: center; }
.send.sending::after { content: ""; position: absolute; inset: 0; background: color-mix(in oklab, var(--color-signal-ink) 18%, transparent); transform-origin: 0 50%; animation: fill 900ms var(--ease-in-out) forwards; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.send-note { margin-top:var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); display: flex; gap:var(--space-xs); align-items: center; }
.sent-ok { display: flex; flex-direction: column; align-items: flex-start; padding:var(--space-xl) 0; gap:var(--space-xs); }
.sent-ok h2 { font-size: var(--text-2xl); margin:var(--space-sm) 0 0; }
.dr-desk { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: 100%; }
.dr-desk .l { border-right: 1px solid var(--color-rule); overflow: auto; padding:0 20px var(--space-lg); }
.dr-desk .l .ph-head { padding:32px var(--space-2xs) var(--space-md); }
.dr-desk .r { overflow: auto; padding:32px 48px; }
.dr-desk .r > div { max-width: 640px; margin:0 auto; }
.xlink { display: flex; gap:var(--space-sm); align-items: center; width: 100%; min-height: 44px; padding:0 var(--space-xs); margin-bottom:var(--space-xs); font-size: var(--text-sm); color: var(--color-ink-2); border-radius: var(--radius-input); text-align: left; }
.xlink .sp { flex: 1; }

.xlink:hover { background: var(--color-paper-2); color: var(--color-ink); }

/* ================= Spaces: a list that scans ================= */
.sp-list { max-width: 1040px; }
.sg { margin-top:var(--space-sm); }
.sp-head .meta { flex-basis: 100%; margin-top:0; }
.sp-head { align-items: baseline; row-gap:var(--space-2xs); }
.sg-h { display: flex; align-items: baseline; gap:var(--space-xs); padding:var(--space-xs) var(--space-2xs) var(--space-2xs); border-bottom: 1px solid var(--color-rule); font-size: var(--text-sm); font-weight: 600; letter-spacing: -0.005em; color: var(--color-ink); }
.sg-h .num { font-weight: 400; color: var(--color-muted); }

.sr { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap:0 var(--space-sm); align-items: center; width: 100%; min-height: 44px; padding:var(--space-2xs) var(--space-2xs); border-bottom: 1px solid var(--color-rule); text-align: left; transition: background-color var(--dur-micro) var(--ease-out); }
.sr:hover { background: var(--color-paper-2); }

.sr-tt { min-width: 0; display: grid; }
.sr-nm { font-size: var(--text-md); font-weight: 500; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sr-r { display: flex; align-items: center; justify-content: flex-end; min-width: 28px; }
.sr-n { font-family: var(--font-outlier); font-size: var(--text-md); color: var(--color-signal); }

.sr.more { color: var(--color-ink-2); }
.sr.more .sr-nm { font-size: var(--text-sm); }
.sr.more .emb { background: transparent; box-shadow: inset 0 0 0 1px var(--color-rule); color: var(--color-muted); }
.sugg-r { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap:var(--space-xs) var(--space-sm); padding:var(--space-sm) var(--space-2xs); border-bottom: 1px solid var(--color-rule); }
.sugg-r .emb { background: transparent; box-shadow: inset 0 0 0 1px var(--color-rule-2); }
.sugg-r .acts { grid-column: 2; display: flex; gap:var(--space-xs); }
.sugg-r .sr-line { white-space: normal; }
/* desktop: the same rows become a table that reads across */
.main .sp-list { padding:0 var(--space-xl) var(--space-2xl); }
.main .sr { grid-template-columns: 28px minmax(160px, 220px) minmax(0, 1fr) 180px 80px 88px; min-height: 52px; }
.main .sr-tt { display: contents; }
.main .sr-line { white-space: nowrap; }
.main .sr-next, .main .sr-asof { display: block; font-size: var(--text-sm); color: var(--color-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main .sr-asof { font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-muted); }
.main .sg-h { padding-top:var(--space-md); }
.main .sp-cols { display: grid; grid-template-columns: 28px minmax(160px, 220px) minmax(0, 1fr) 180px 80px 88px; gap:0 var(--space-sm); padding:0 var(--space-2xs) var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); border-bottom: 1px solid var(--color-rule); }
.sp-cols { display: none; }
.main .sp-cols span:last-child { text-align: right; }
.main .sugg-r { grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; }
.main .sugg-r .acts { grid-column: 3; grid-row: 1; }

/* ================= Space detail ================= */
.hero { position: relative; padding:var(--space-xs) 20px 20px; border-bottom: 1px solid var(--color-rule); }
.hero .top { display: flex; justify-content: space-between; align-items: center; margin:0 calc(-1 * var(--space-xs)) var(--space-md); }

.hero .asof { font-size: var(--text-xs); color: var(--color-muted); margin-top:var(--space-xs); display: flex; gap:var(--space-xs); align-items: center; }
.hfacts { margin-top:var(--space-sm); font-size: var(--text-sm); color: var(--color-ink-2); }
.hfacts span + span::before { content: ", "; }

.hms { margin-top:20px; display: flex; gap:var(--space-2xs); }
.hms div { flex: 1; min-width: 0; }
.hms i { display: block; height: 4px; border-radius: var(--space-3xs); background: var(--color-paper-3); position: relative; overflow: hidden; }

.hms span { display: block; font-size: var(--text-2xs); margin-top:var(--space-xs); color: var(--color-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hms div.on span { color: var(--color-ink-2); }
.mini-stack { display: grid; }
.mcard { display: flex; gap:var(--space-sm); align-items: center; padding:var(--space-sm) 0; border-top: 1px solid var(--color-rule); position: relative; }
.mcard:first-child { border-top: 0; }
.mcard .tt { flex: 1; min-width: 0; display: grid; }
.mcard b { display: block; font-weight: 500; line-height: 1.3; }

}

  if(d.wract){const k=d.wract;if(k==="undo")return wrUndo();return fling(k==="accept"?1:-1,k);}

  if(d.stact){const [k,...r]=d.stact.split(":");const v=r.join(":");if(k==="go")return go(v);if(k==="state"){S.state=v;return render();}if(k==="toast")return toast(v);}
  const a=d.act;if(!a)return;

  if(a==="rmx-next"){S.rmx.step=Math.min(3,S.rmx.step+1);render();const _s=document.getElementById("scroller");_s&&(_s.scrollTop=0);return;}
  if(a==="rmx-back"){if(!S.rmx.step)return go("install");S.rmx.step--;return render();}

  if(a==="share-start"){S.share={step:0,sp:S.screen==="space"?S.spaceId:"house"};return go("share");}
  if(a==="share-next"){S.share.step=Math.min(2,S.share.step+1);render();const _s=document.getElementById("scroller");_s&&(_s.scrollTop=0);return;}
  if(a==="share-back"){S.share.step=Math.max(0,S.share.step-1);return render();}

  if(a==="toast-undo"){const u=S.toast&&S.toast.undo;S.toast=null;u?u():render();return;}

document.addEventListener("change",e=>{if(e.target.dataset.rmxoff){const k=+e.target.dataset.rmxoff;S.rmx.off[k]=!e.target.checked;return render();}if(e.target.dataset.rmxsched){S.rmx.sched[+e.target.dataset.rmxsched]=e.target.value;return;}if(e.target.dataset.shvis){S.share.vis=e.target.dataset.shvis;return render();}const rt=e.target.dataset.onbrt;if(rt){S.onb.rt[rt]=e.target.checked;return;}const al=e.target.dataset.always;if(al){S.appr.always[al]=e.target.checked;toast(e.target.checked?"Always allowed. Turn it off in the Space any time":"Back to asking first");}});
document.addEventListener("submit",e=>{if(e.target.dataset.chatform){e.preventDefault();const i=document.getElementById("chat-in");const v=i&&i.value.trim();if(v)chatAsk(v);}});
document.addEventListener("input",e=>{if(e.target.dataset.shname){S.share.name=e.target.value;return;}if(e.target.dataset.shdesc){S.share.desc=e.target.value;return;}if(e.target.dataset.rmxname){S.rmx.name=e.target.value;const b=document.querySelector('[data-act="rmx-next"]');b&&(b.disabled=!S.rmx.name.trim());return;}const tn=e.target.dataset.tplname;if(tn){S.tpl.name[tn]=e.target.value;return;}const id=e.target.dataset.dbody;if(id){const d=S.drafts.find(x=>x.id===id);if(d)d.edited=e.target.value;}});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select"))return;
  if(e.key==="Escape"){if(S.sheet||S.more){S.sheet=null;S.more=null;render();}return;}
  if(S.sheet)return;
  if(S.screen==="triage"&&S.tri.idx<TRI.length){
    const t=TRI[S.tri.idx];
    if(e.key==="ArrowRight"){e.preventDefault();fling(1,"reply");}
    else if(e.key==="ArrowLeft"){e.preventDefault();fling(-1,"ignore");}
    else if(e.key.toLowerCase()==="s")fling(0,"snooze");
    else if(e.key.toLowerCase()==="m")fling(0,"mute");
    else if(/^[1-4]$/.test(e.key)&&t.intents[+e.key-1]){S.tri.intent[t.id]=t.intents[+e.key-1];render();}
  }
  if(S.screen==="triage"&&e.key.toLowerCase()==="z")triUndo();
  if(S.screen==="weekly"&&S.wr.idx<WR.length){if(e.key==="ArrowRight"){e.preventDefault();fling(1,"accept");}else if(e.key==="ArrowLeft"){e.preventDefault();fling(-1,"keep");}else if(e.key.toLowerCase()==="z")wrUndo();}
  if(e.key==="Escape"&&["chat","weekly"].includes(S.screen))back();
  if(S.screen==="today"){const c=currentCard();if(!c)return;
    if(e.key==="Enter"&&!e.target.closest("button")){e.preventDefault();cardAct(c.id,cardParts(c).pri[1]);}
    if(e.key.toLowerCase()==="j"){const o=openCards();const i=o.indexOf(c);S.focusCard=o[(i+1)%o.length].id;S.settle=true;render();}
  }
});
function startRec(){clearInterval(capTimer);capTimer=setInterval(()=>{S.cap.t+=1;if(S.cap.t>=300)clearInterval(capTimer);const tx=document.querySelector(".live-tx"),tm=document.querySelector(".timer"),hw=document.querySelector(".heard-w");if(tx&&tm){tx.innerHTML=capLive();tm.textContent=capClock();if(hw){const h=capHeard();if(hw.innerHTML!==h)hw.innerHTML=h;}}else render();},100);}
function startOnb(){clearInterval(onbTimer);onbTimer=setInterval(()=>{const O=S.onb;if(O.step!==1){clearInterval(onbTimer);return;}if(O.prog>=2&&O.asked===null){return;}O.prog=Math.min(5,O.prog+1);if(O.prog>=5)clearInterval(onbTimer);render();},reduced()?20:850);}
